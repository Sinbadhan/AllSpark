[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allspark"
version = "1.0.3"
description = "火种 AllSpark — 离线人工智能生存系统"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "AllSpark contributors" },
]
requires-python = ">=3.10"
keywords = ["offline-ai", "survival", "knowledge-base", "fastapi", "llm", "raspberry-pi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Major-version caps prevent silent breakage from upstream majors
    # (e.g. starlette 1.x / fastapi pin drift). Audit L8.
    "pyyaml>=6.0,<7",
    "rich>=13.0,<16",
    "jieba>=0.42,<1",
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
    "jinja2>=3.1,<4",
    # SHA-157: model_registry reads models.yaml via tomllib (stdlib 3.11+) and
    # falls back to tomli on Python 3.10. Declared as a conditional runtime dep
    # so a clean wheel install on 3.10 can import allspark / run the CLI.
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<10",
    "ruff>=0.4,<1",
    "mypy>=1.8,<3",
    # starlette 1.x TestClient requires httpx2 (httpx is deprecated; SHA-145).
    # Declared so CI fresh installs can collect the Web/TestClient test modules.
    "httpx2>=0.2,<3",
    # Direct ASGI client and regression harness tests still import the standard
    # httpx package. Keep it explicit so a clean CI environment matches local
    # collection instead of inheriting an unrelated global installation.
    "httpx>=0.28,<1",
    # Coverage gate (SHA-151): JSON-backed total-line and per-module branch
    # floors. pytest-cov 7 delegates subprocess measurement to coverage.py's
    # explicit patch mechanism configured below.
    "pytest-cov>=7.1,<8",
    # SHA-196 browser gate drives an already-installed Chrome over the local
    # DevTools protocol; it does not download browsers or contact the internet.
    "websockets>=12,<17",
]
rag = [
    "sentence-transformers>=2.7",
    "qdrant-client>=1.9",
    "sqlite-vss>=0.1.2",
]
vision = [
    "onnxruntime>=1.17",
    "Pillow>=10.0",
]
voice = [
    "openai-whisper>=20231117",
    "sounddevice>=0.4",
    "pyttsx3>=2.90",
    "webrtcvad>=2.0",
    "openwakeword>=0.6",
]
delivery = [
    # Build-only dependency for the self-contained macOS delivery artifact.
    # Pin the freezer and hook set so artifact inputs cannot drift silently.
    "pyinstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
]

[project.urls]
Homepage = "https://github.com/Sinbadhan/AllSpark"
Repository = "https://github.com/Sinbadhan/AllSpark.git"
Issues = "https://github.com/Sinbadhan/AllSpark/issues"
Changelog = "https://github.com/Sinbadhan/AllSpark/blob/main/CHANGELOG.md"

[project.scripts]
allspark = "allspark.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
warn_return_any = false
check_untyped_defs = true
# Historical typing debt is tracked separately; CI now checks typed surfaces and
# untyped function bodies with no disabled error-code categories.
# Cleared in SHA-29 step 1-4: list-item, var-annotated, return-value, call-overload.
# Cleared in SHA-40: assignment, arg-type, operator, attr-defined (all four
# previously-disabled codes are now enforced; mypy runs clean with no
# disable_error_code overrides).

[tool.coverage.run]
branch = true
source = ["allspark"]
patch = ["subprocess"]
omit = ["allspark/templates/*", "allspark/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# SHA-36: hardware/live-model smoke tests are gated behind explicit markers so
# they never get silently folded into the "all green" automated count. They
# run only when the matching env var is set (real hardware / downloaded GGUF).
markers = [
    "requires_llm: needs llama-cpp-python + a downloaded GGUF (live model)",
    "requires_voice: needs microphone + whisper/pyttsx3 (real audio I/O)",
    "requires_vision: needs a multimodal model + sample image",
    "requires_network: needs real peer discovery / multi-node hardware",
    "requires_docker: needs a running docker daemon",
]

[tool.setuptools.packages.find]
include = ["allspark*"]

[tool.setuptools.package-data]
allspark = ["py.typed", "data/*.yaml", "data/knowledge/*.yaml", "data/safety/*.yaml", "locales/*.yaml", "templates/*.html"]
