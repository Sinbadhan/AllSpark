<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLSPARK — {{ t('web_init_document_title') }}</title>
<style>
:root {
  --bg:#0a0a0a;--surface:#131313;--surface-2:#1b1c1c;--border:#353535;
  --primary:#ff6b35;--primary-soft:#ffb59d;--text:#e0e0e0;--muted:#b8b8b8;
  --success:#44cc44;--warning:#ffaa00;--critical:#ff4444;--radius:8px;
  --mono:'SF Mono','Menlo','Consolas','Liberation Mono',monospace;
}
*{box-sizing:border-box}html,body{margin:0;min-width:0}
body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--mono);display:flex;align-items:flex-start;justify-content:center}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.hidden{display:none!important}.init-container{width:min(760px,100%);padding:16px;margin:auto}
.init-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-height:calc(100dvh - 32px);overflow-y:auto;scroll-padding-bottom:96px}
.init-main{padding:28px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}.brand-mark{display:grid;place-items:center;width:36px;height:36px;background:var(--primary);color:#3b1000;border-radius:4px;font-weight:800}.brand h1{margin:0;color:var(--primary);font-size:26px}.subtitle{margin:0 0 20px 48px;color:var(--muted);font-size:13px}
.progress{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0;margin:0 0 22px}.progress li{height:4px;background:var(--border);border-radius:999px}.progress li.active{background:var(--primary)}.progress li.done{background:var(--success)}
.step h2{font-size:20px;color:var(--primary-soft);margin:0 0 8px}.step-intro{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 18px}.promise{background:#0e0e0e;border-left:3px solid var(--primary);padding:16px;margin:16px 0}.promise strong{display:block;margin-bottom:6px}.danger-note{border:1px solid var(--warning);color:#ffd37a;padding:12px;margin:12px 0;font-size:13px;line-height:1.5}
.danger-entry{border:2px solid var(--critical);background:#260909;padding:14px;margin:0 0 18px;border-radius:6px}.danger-entry .btn{width:100%;background:var(--critical);border-color:var(--critical);color:#210000;margin:0}.danger-entry p{font-size:12px;line-height:1.5;margin:8px 0 0;color:#ffd0d0}.danger-dialog{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:16px}.danger-dialog-card{width:min(680px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--surface);border:2px solid var(--critical);border-radius:8px;padding:22px}.danger-dialog-header{display:flex;align-items:flex-start;gap:12px}.danger-dialog-header h2{margin:0;color:#ff8a8a;font-size:21px}.danger-dialog-header .btn{margin-left:auto}.danger-question h3,.danger-action h3{color:var(--primary-soft);font-size:17px}.danger-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger-options .btn{margin:0;text-align:left}.danger-review{border-left:3px solid var(--warning);padding:10px 12px;color:#ffd37a;font-size:12px}.danger-action-text{font-size:17px;line-height:1.55;border:1px solid var(--critical);padding:14px}.danger-evidence{overflow-wrap:anywhere}.danger-evidence h4{margin:16px 0 6px;color:var(--primary-soft)}.danger-evidence ul{margin:0;padding-left:20px;font-size:12px;line-height:1.6}.danger-source{border-top:1px solid var(--border);padding-top:8px;margin-top:8px;font-size:11px;color:var(--muted)}.danger-actions{position:sticky;bottom:-22px;display:flex;gap:8px;margin:20px -22px -22px;padding:12px 22px;background:var(--surface);border-top:1px solid var(--border)}
.language-grid,.choice-row{display:flex;gap:8px;flex-wrap:wrap}.choice-button,.language-button{min-height:44px;border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:10px 14px}.language-button{flex:1}.language-button[aria-pressed="true"]{border-color:var(--primary);background:#ff6b351a}.choice-button:has(input:checked){border-color:var(--primary);background:#ff6b351a}
fieldset{border:1px solid var(--border);border-radius:6px;padding:14px;margin:0 0 14px;min-width:0}legend{padding:0 6px;font-weight:700;color:var(--primary-soft)}label{font-size:13px}.field{margin:12px 0}.field>label{display:block;margin-bottom:6px;color:var(--muted)}input[type="number"],input[type="text"],select{width:100%;min-height:44px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:9px 10px}input:disabled{opacity:.55}.helper{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}.threat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.threat-grid label{min-height:40px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);padding:8px;border-radius:4px}
.resources{display:grid;grid-template-columns:1fr 1fr;gap:12px}.resource-panel{margin:0}.resource-panel .choice-row{margin-bottom:10px}.rate-fields{border-top:1px solid var(--border);margin-top:12px;padding-top:10px}.outlier{border:1px solid var(--warning);padding:10px;color:#ffd37a;margin-top:10px}.source-preview{font-size:11px;color:var(--muted);margin-top:8px}
.error-summary{border:2px solid var(--critical);background:#ff444414;padding:14px;margin:0 0 18px;border-radius:4px}.error-summary h2{font-size:15px;color:#ff8a8a;margin:0 0 8px}.error-summary ul{margin:0;padding-left:22px;font-size:13px}.error-summary a{color:#ffb2b2}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary-box{border:1px solid var(--border);padding:14px;border-radius:5px;min-width:0}.summary-box h3{font-size:14px;margin:0 0 10px;color:var(--primary-soft)}.summary-box ul{padding-left:20px;margin:0;font-size:12px;line-height:1.7}.summary-box.actions{grid-column:1/-1}.deferred{color:var(--muted)}details{margin-top:14px;border:1px solid var(--border);padding:10px;border-radius:4px}summary{cursor:pointer}.confirm-row{display:flex;align-items:flex-start;gap:10px;margin:18px 0;padding:12px;border:1px solid var(--border)}.confirm-row input{margin-top:2px}
.plan-selection{margin-top:16px}.plan-phase{color:var(--primary-soft);font-weight:700;margin:0 0 10px}.plan-options{display:grid;gap:8px}.plan-option{display:grid;grid-template-columns:auto 1fr;gap:10px;border:1px solid var(--border);border-radius:6px;padding:12px;background:var(--bg);min-width:0}.plan-option:has(input:checked){border-color:var(--primary);background:#ff6b3512}.plan-option input{margin-top:3px}.plan-copy{display:grid;gap:5px;min-width:0;overflow-wrap:anywhere}.plan-copy strong{color:var(--text)}.plan-copy span{font-size:12px;line-height:1.45;color:var(--muted)}.plan-copy .plan-risk{color:#ffd37a}.plan-secondary{margin-top:12px}.plan-secondary ol{margin:6px 0 0;padding-left:22px;font-size:12px;line-height:1.6}
.step-footer{position:sticky;bottom:-1px;z-index:3;display:flex;justify-content:space-between;gap:10px;margin:24px -28px -28px;padding:14px 28px;background:linear-gradient(180deg,rgba(19,19,19,.94),var(--surface) 30%);border-top:1px solid var(--border)}.btn{min-height:44px;border-radius:4px;padding:9px 18px;font-weight:700}.btn-primary{border:1px solid var(--primary);background:var(--primary);color:#421100;margin-left:auto}.btn-secondary{border:1px solid var(--border);background:var(--surface-2)}.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--primary-soft);outline-offset:3px}@media(max-width:560px){.init-container{padding:0}.init-card{border-radius:0;max-height:100dvh;border-left:0;border-right:0}.init-main{padding:16px}.subtitle{margin-left:0}.resources,.summary-grid{grid-template-columns:1fr}.summary-box.actions{grid-column:auto}.threat-grid{grid-template-columns:1fr}.step-footer{margin:20px -16px -16px;padding:12px 16px;flex-wrap:wrap}.step-footer .btn{flex:1}.choice-button{flex:1;padding:8px}.language-grid{flex-direction:column}.danger-dialog{padding:0}.danger-dialog-card{max-height:100dvh;border-radius:0;border-left:0;border-right:0;padding:16px}.danger-options{grid-template-columns:1fr}.danger-actions{bottom:-16px;margin:16px -16px -16px;padding:12px 16px}}
@media(max-height:520px){.init-container{padding:0}.init-card{max-height:100dvh}.init-main{padding-top:12px}.brand{margin-bottom:2px}.subtitle{margin-bottom:10px}.progress{margin-bottom:14px}.step-footer{padding-bottom:max(10px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="init-container">
  <div class="init-card" id="init-card">
    <div class="init-main">
      <header class="brand"><div class="brand-mark" aria-hidden="true">A</div><h1>ALLSPARK</h1></header>
      <p class="subtitle" data-i18n="web_init_subtitle"></p>
      <ol class="progress" aria-hidden="true">
        <li id="dot-1"></li><li id="dot-2"></li><li id="dot-3"></li><li id="dot-4"></li>
      </ol>
      <aside class="danger-entry" aria-labelledby="immediate-danger-entry-label">
        <button type="button" class="btn" id="immediate-danger-open" data-action="danger-open"><span id="immediate-danger-entry-label" data-i18n="web_init_immediate_danger_button"></span></button>
        <p data-i18n="web_init_immediate_danger_hint"></p>
      </aside>
      <section id="init-errors" class="error-summary hidden" role="alert" tabindex="-1" aria-labelledby="init-errors-title">
        <h2 id="init-errors-title" data-i18n="web_init_error_summary_title"></h2><ul id="init-error-list"></ul>
      </section>

      <section class="step" id="step-1" aria-labelledby="step-1-title">
        <h2 id="step-1-title" tabindex="-1" data-i18n="web_init_promise_title"></h2>
        <div class="promise"><strong data-i18n="web_init_promise_heading"></strong><span data-i18n="web_init_promise_body"></span></div>
        <fieldset><legend data-i18n="web_init_lang_select"></legend>
          <div class="language-grid" role="group">
            <button type="button" class="language-button" id="lang-zh" data-action="language" data-lang="zh" aria-pressed="false">中文</button>
            <button type="button" class="language-button" id="lang-en" data-action="language" data-lang="en" aria-pressed="false">English</button>
          </div>
        </fieldset>
        <div class="step-footer"><button type="button" class="btn btn-primary" id="btn-step1-next" data-action="next" data-next="2" disabled data-i18n="web_init_begin_assessment"></button></div>
      </section>

      <section class="step hidden" id="step-2" aria-labelledby="step-2-title">
        <h2 id="step-2-title" tabindex="-1" data-i18n="web_init_step_situation"></h2>
        <p class="step-intro" data-i18n="web_init_explicit_intro"></p>
        <form id="situation-form" novalidate>
          <fieldset id="field-people_count"><legend data-i18n="assessment_field_people_count"></legend>
            <div class="choice-row">
              <label class="choice-button"><input type="radio" name="people-state" value="known"> <span data-i18n="init_assessment_known"></span></label>
              <label class="choice-button"><input type="radio" name="people-state" value="unknown"> <span data-i18n="init_assessment_unknown"></span></label>
            </div>
            <div class="field"><label for="people-count" data-i18n="init_assessment_people_value"></label><input id="people-count" type="number" min="1" max="10000" step="1" disabled></div>
          </fieldset>
          <div class="field" id="field-health"><label for="health" data-i18n="assessment_field_health"></label><select id="health" required><option value="" data-i18n="web_init_choose_explicitly"></option><option value="healthy" data-i18n="q_health_healthy"></option><option value="minor_injury" data-i18n="q_health_minor"></option><option value="serious_injury" data-i18n="q_health_serious"></option><option value="chronic_condition" data-i18n="q_health_chronic"></option><option value="critical" data-i18n="q_health_critical"></option><option value="unknown" data-i18n="init_assessment_unknown"></option></select></div>
          <div class="field" id="field-urgency"><label for="urgency" data-i18n="assessment_field_urgency"></label><select id="urgency" required><option value="" data-i18n="web_init_choose_explicitly"></option><option value="immediate_danger" data-i18n="q_urgency_immediate"></option><option value="stable_but_urgent" data-i18n="q_urgency_urgent"></option><option value="stable" data-i18n="q_urgency_stable"></option><option value="comfortable" data-i18n="q_urgency_comfortable"></option><option value="unknown" data-i18n="init_assessment_unknown"></option></select></div>
          <div class="field" id="field-shelter"><label for="shelter" data-i18n="assessment_field_shelter"></label><select id="shelter" required><option value="" data-i18n="web_init_choose_explicitly"></option><option value="permanent_building" data-i18n="q_shelter_permanent"></option><option value="temporary_shelter" data-i18n="q_shelter_temporary"></option><option value="vehicle" data-i18n="q_shelter_vehicle"></option><option value="open_air" data-i18n="q_shelter_open_air"></option><option value="underground" data-i18n="q_shelter_underground"></option><option value="none" data-i18n="q_shelter_none"></option><option value="unknown" data-i18n="init_assessment_unknown"></option></select></div>
          <fieldset id="field-threats"><legend data-i18n="assessment_field_threats"></legend>
            <div class="choice-row">
              <label class="choice-button"><input type="radio" name="threat-state" value="none"> <span data-i18n="init_assessment_threat_none"></span></label>
              <label class="choice-button"><input type="radio" name="threat-state" value="selected"> <span data-i18n="init_assessment_threat_selected"></span></label>
              <label class="choice-button"><input type="radio" name="threat-state" value="unknown"> <span data-i18n="init_assessment_unknown"></span></label>
            </div>
            <div id="threat-options" class="threat-grid hidden">
              <label><input type="checkbox" value="extreme_weather"> <span data-i18n="q_threat_weather"></span></label><label><input type="checkbox" value="wildlife"> <span data-i18n="q_threat_wildlife"></span></label><label><input type="checkbox" value="contamination"> <span data-i18n="q_threat_contamination"></span></label><label><input type="checkbox" value="structural_collapse"> <span data-i18n="q_threat_collapse"></span></label><label><input type="checkbox" value="flooding"> <span data-i18n="q_threat_flooding"></span></label><label><input type="checkbox" value="fire_risk"> <span data-i18n="q_threat_fire"></span></label><label><input type="checkbox" value="human_threat"> <span data-i18n="q_threat_human"></span></label><label><input type="checkbox" value="disease"> <span data-i18n="q_threat_disease"></span></label>
            </div>
          </fieldset>
        </form>
        <div class="step-footer"><button type="button" class="btn btn-secondary" data-action="back" data-next="1" data-i18n="web_init_btn_back"></button><button type="button" class="btn btn-primary" data-action="situation-next" data-i18n="web_init_continue_resources"></button></div>
      </section>

      <section class="step hidden" id="step-3" aria-labelledby="step-3-title">
        <h2 id="step-3-title" tabindex="-1" data-i18n="web_init_step_resources"></h2>
        <p class="step-intro" data-i18n="web_init_resource_intro"></p>
        <form id="resource-form" class="resources" novalidate>
        {% for resource, unit, max_value in [('power','Wh',1000000),('water','L',100000),('food','kcal',100000000),('fire','uses',100000),('storage','GB',100000)] %}
          <fieldset class="resource-panel" id="field-{{ resource }}" data-resource="{{ resource }}" data-unit="{{ unit }}" data-soft-max="{{ max_value }}"><legend data-i18n="assessment_field_{{ resource }}"></legend>
            <p class="helper" id="{{ resource }}-amount-status-label" data-i18n="web_init_amount_status"></p><div class="choice-row" role="radiogroup" aria-labelledby="{{ resource }}-amount-status-label">
              <label class="choice-button"><input type="radio" name="{{ resource }}-amount-state" value="known"> <span data-i18n="init_assessment_known"></span></label>
              <label class="choice-button"><input type="radio" name="{{ resource }}-amount-state" value="unknown"> <span data-i18n="init_assessment_unknown"></span></label>
            </div>
            <div class="field"><label for="{{ resource }}-amount"><span data-i18n="web_init_current_amount"></span> (<span data-i18n="resource_unit_{{ resource }}"></span>)</label><input id="{{ resource }}-amount" data-kind="amount" type="number" min="0" step="any" disabled></div>
            <div class="rate-fields"><p class="helper" id="{{ resource }}-rate-status-label" data-i18n="web_init_rate_explicit"></p><div class="choice-row" role="radiogroup" aria-labelledby="{{ resource }}-rate-status-label">
              <label class="choice-button"><input type="radio" name="{{ resource }}-rate-state" value="unknown"> <span data-i18n="init_assessment_rate_unknown"></span></label>
              <label class="choice-button"><input type="radio" name="{{ resource }}-rate-state" value="estimate"> <span data-i18n="init_assessment_rate_estimate"></span></label>
            </div><div class="rate-estimate hidden" id="{{ resource }}-rate-fields"><div class="field"><label for="{{ resource }}-consumption"><span data-i18n="init_assessment_daily_consumption"></span> (<span data-i18n="resource_unit_{{ resource }}"></span>/<span data-i18n="web_init_day_short"></span>)</label><input id="{{ resource }}-consumption" data-kind="rate" type="number" min="0" step="any" disabled></div><div class="field"><label for="{{ resource }}-intake"><span data-i18n="init_assessment_daily_intake"></span> (<span data-i18n="resource_unit_{{ resource }}"></span>/<span data-i18n="web_init_day_short"></span>)</label><input id="{{ resource }}-intake" data-kind="rate" type="number" min="0" step="any" disabled></div></div></div>
            <label class="outlier hidden" id="{{ resource }}-outlier"><input type="checkbox" id="{{ resource }}-confirm-outlier"> <span data-i18n="web_init_outlier_ack"></span></label>
          </fieldset>
        {% endfor %}
        </form>
        <div class="step-footer"><button type="button" class="btn btn-secondary" data-action="back" data-next="2" data-i18n="web_init_btn_back"></button><button type="button" class="btn btn-primary" id="btn-review" data-action="review" data-i18n="web_init_review"></button></div>
      </section>

      <section class="step hidden" id="step-4" aria-labelledby="step-4-title">
        <h2 id="step-4-title" tabindex="-1" data-i18n="web_init_step_summary"></h2><p class="step-intro" data-i18n="web_init_summary_intro"></p>
        <div class="summary-grid"><section class="summary-box"><h3 data-i18n="web_init_summary_known"></h3><ul id="summary-known"></ul></section><section class="summary-box"><h3 data-i18n="web_init_summary_unknown"></h3><ul id="summary-unknown"></ul></section><section class="summary-box actions"><h3 data-i18n="web_init_summary_resources"></h3><ul id="summary-resources"></ul></section></div>
        <fieldset id="plan-selection" class="plan-selection"><legend id="plan-selection-title" data-i18n="survival_plan_heading"></legend><p id="plan-phase" class="plan-phase"></p><p class="helper" data-i18n="web_init_plan_select_intro"></p><div id="plan-primary-options" class="plan-options" role="radiogroup" aria-labelledby="plan-selection-title"></div><section id="plan-secondary" class="plan-secondary"><strong data-i18n="web_init_plan_later_actions"></strong><ol id="plan-secondary-list"></ol></section></fieldset>
        <details id="hardware-details"><summary data-i18n="web_init_hardware_optional"></summary><p id="hardware-summary" class="helper"></p><p class="helper" data-i18n="web_init_model_deferred"></p></details>
        <label class="confirm-row"><input id="assessment-confirmed" type="checkbox"> <span data-i18n="web_init_confirm_truth"></span></label>
        <div class="step-footer"><button type="button" class="btn btn-secondary" data-action="back" data-next="3" data-i18n="web_init_btn_back"></button><button type="button" class="btn btn-primary" id="btn-complete" data-action="complete" disabled data-i18n="web_init_confirm_publish"></button></div>
      </section>
    </div>
  </div>
</main>
<section id="immediate-danger-dialog" class="danger-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="immediate-danger-title">
  <div class="danger-dialog-card">
    <header class="danger-dialog-header"><h2 id="immediate-danger-title" tabindex="-1" data-i18n="immediate_danger_dialog_title"></h2><button type="button" class="btn btn-secondary" id="immediate-danger-close" data-action="danger-close" data-i18n="immediate_danger_dialog_close"></button></header>
    <div id="immediate-danger-content" aria-live="polite"></div>
    <div class="danger-actions"><button type="button" class="btn btn-secondary hidden" id="immediate-danger-back" data-action="danger-back" data-i18n="immediate_danger_back"></button><button type="button" class="btn btn-secondary" data-action="danger-close" data-i18n="immediate_danger_dialog_close"></button></div>
  </div>
</section>
<script nonce="{{ csp_nonce }}">
const INIT_I18N={{ init_i18n|tojson }};
let selectedLang=null,currentStep=1,lastAssessment=null,lastSummary=null,lastPlan=null,selectedPrimaryActionId=null,hardwareInfo=null,hardwareRequested=false,dangerFacts={},dangerHistory=[],dangerReturnFocus=null,dangerGeneration=0;
const $=id=>document.getElementById(id);
function tr(key){return (INIT_I18N[selectedLang||'en']||{})[key]||key}
function applyTranslations(){document.documentElement.lang=selectedLang||'en';document.title='ALLSPARK — '+tr('web_init_document_title');document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});document.querySelectorAll('[data-i18n-aria-label]').forEach(el=>el.setAttribute('aria-label',tr(el.dataset.i18nAriaLabel)));renderHardwareSummary();if(lastPlan)populatePlan(lastPlan)}
function dangerLabel(value){return tr('immediate_danger_option_'+value)}
async function updateDanger(){const generation=++dangerGeneration,content=$('immediate-danger-content');$('immediate-danger-back').disabled=true;content.textContent='';try{const result=await api('/api/immediate-danger/assess',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({language:selectedLang||'en',facts:dangerFacts})});if(generation!==dangerGeneration||$('immediate-danger-dialog').classList.contains('hidden'))return;$('immediate-danger-back').disabled=false;$('immediate-danger-back').classList.toggle('hidden',dangerHistory.length===0);if(result.status==='needs_fact'){const wrapper=document.createElement('section'),heading=document.createElement('h3'),options=document.createElement('div');wrapper.className='danger-question';heading.id='danger-question-title';heading.tabIndex=-1;heading.textContent=tr('immediate_danger_fact_'+result.question.field);options.className='danger-options';options.setAttribute('role','group');options.setAttribute('aria-labelledby',heading.id);result.question.options.forEach(value=>{const button=document.createElement('button');button.type='button';button.className='btn btn-secondary';button.dataset.action='danger-choice';button.dataset.field=result.question.field;button.dataset.value=value;button.textContent=dangerLabel(value);options.append(button)});wrapper.append(heading,options);content.append(wrapper);heading.focus();return}renderDangerAction(result)}catch(error){if(generation!==dangerGeneration||$('immediate-danger-dialog').classList.contains('hidden'))return;$('immediate-danger-back').disabled=false;const message=document.createElement('p');message.tabIndex=-1;message.setAttribute('role','alert');message.textContent=tr(error.payload?.error==='immediate_danger_catalog_unavailable'?'immediate_danger_catalog_unavailable':'immediate_danger_error_invalid_input');content.append(message);message.focus()}}
function appendDangerList(parent,headingKey,values){const heading=document.createElement('h4'),list=document.createElement('ul');heading.textContent=tr(headingKey);values.forEach(value=>{const li=document.createElement('li');li.textContent=value;list.append(li)});parent.append(heading,list)}
function renderDangerAction(result){const action=result.action,content=$('immediate-danger-content'),wrapper=document.createElement('section'),heading=document.createElement('h3'),text=document.createElement('p'),boundary=document.createElement('p'),ephemeral=document.createElement('p'),evidenceDetails=document.createElement('details'),evidenceSummary=document.createElement('summary'),evidence=document.createElement('div'),communication=document.createElement('section');wrapper.className='danger-action';wrapper.dataset.actionId=action.action_id;wrapper.dataset.actionRevision=String(action.revision);wrapper.dataset.actionHash=action.content_hash;heading.id='danger-action-title';heading.tabIndex=-1;heading.textContent=tr('immediate_danger_action_heading');text.className='danger-action-text';text.textContent=action.text;communication.id='danger-communication';const communicationLabel=document.createElement('h4');communicationLabel.id='danger-communication-title';communicationLabel.textContent=tr('immediate_danger_fact_communication');communication.append(communicationLabel);if(result.follow_up_question){const options=document.createElement('div');options.className='danger-options';options.setAttribute('role','group');options.setAttribute('aria-labelledby',communicationLabel.id);result.follow_up_question.options.forEach(value=>{const button=document.createElement('button');button.type='button';button.className='btn btn-secondary';button.dataset.action='danger-choice';button.dataset.field='communication';button.dataset.value=value;button.textContent=dangerLabel(value);options.append(button)});communication.append(options)}else{const selected=document.createElement('p');selected.id='danger-communication-selected';selected.textContent=tr('immediate_danger_communication_selected').replace('{status}',dangerLabel(action.communication_status));communication.append(selected)}boundary.className='danger-review';boundary.textContent=tr('immediate_danger_source_boundary');ephemeral.className='helper';ephemeral.textContent=tr('immediate_danger_ephemeral_boundary');evidenceSummary.textContent=tr('immediate_danger_evidence_disclosure');evidence.className='danger-evidence';appendDangerList(evidence,'immediate_danger_applicable_heading',action.applicable_when_labels);appendDangerList(evidence,'immediate_danger_contraindications_heading',action.contraindications);const escalationHeading=document.createElement('h4'),escalation=document.createElement('p');escalationHeading.textContent=tr('immediate_danger_escalation_heading');escalation.textContent=action.escalation;evidence.append(escalationHeading,escalation);if(action.sources.length){const sourceHeading=document.createElement('h4');sourceHeading.textContent=tr('immediate_danger_sources_heading');evidence.append(sourceHeading);action.sources.forEach(source=>{const item=document.createElement('div');item.className='danger-source';item.textContent=source.organization+' · '+source.title+' · '+source.locator+' · '+source.revision;evidence.append(item)})}const notContacted=document.createElement('p');notContacted.textContent=tr('immediate_danger_not_contacted');evidence.append(notContacted);evidenceDetails.append(evidenceSummary,evidence);wrapper.append(heading,text,communication,boundary,ephemeral,evidenceDetails);content.append(wrapper);heading.focus()}
function openDanger(trigger=null){dangerReturnFocus=trigger||document.activeElement;dangerFacts={};dangerHistory=[];document.querySelector('main').inert=true;$('immediate-danger-dialog').classList.remove('hidden');document.body.style.overflow='hidden';updateDanger()}
function closeDanger(){dangerGeneration++;$('immediate-danger-dialog').classList.add('hidden');document.querySelector('main').inert=false;document.body.style.overflow='';dangerFacts={};dangerHistory=[];$('immediate-danger-content').replaceChildren();(dangerReturnFocus||$('immediate-danger-open')).focus()}
function clearErrors(){ $('init-errors').classList.add('hidden');$('init-error-list').replaceChildren() }
function fieldLabel(field){let domain=field.startsWith('resources.')?field.split('.')[1]:field.split('.')[0];return tr('assessment_field_'+domain)}
function errorMessage(error){let key=(error.field==='plan_id'||error.field==='primary_action_id')?'error_survival_plan_'+error.code:'error_assessment_'+error.code;let template=tr(key);return template.replace('{field}',fieldLabel(error.field))}
function errorFocusTarget(error){const parts=error.field.split('.');if(parts[0]==='plan_id'||parts[0]==='primary_action_id')return document.querySelector('input[name="primary-action"]')||$('plan-selection');if(parts[0]==='resources'){const type=parts[1],leaf=parts.at(-1);if(error.code==='outlier_confirmation')return $(type+'-confirm-outlier');if(leaf==='amount')return $(type+'-amount');if(leaf==='daily_consumption')return $(type+'-consumption');if(leaf==='daily_intake')return $(type+'-intake');if(parts[2]==='rates')return document.querySelector(`input[name="${type}-rate-state"]`);if(leaf==='status')return document.querySelector(`input[name="${type}-amount-state"]`);return document.querySelector(`#field-${type} input:not([disabled])`)}if(parts[0]==='people_count')return $('people-count').disabled?document.querySelector('input[name="people-state"]'):$('people-count');if(parts[0]==='threats')return document.querySelector('input[name="threat-state"]');return $(parts[0])}
function showErrors(errors){const summary=$('init-errors'),list=$('init-error-list');list.replaceChildren();errors.forEach(error=>{const li=document.createElement('li'),a=document.createElement('a'),planField=error.field==='plan_id'||error.field==='primary_action_id',fieldId=planField?'plan-selection':'field-'+(error.field.startsWith('resources.')?error.field.split('.')[1]:error.field.split('.')[0]);a.href='#'+fieldId;a.textContent=errorMessage(error);a.addEventListener('click',event=>{event.preventDefault();const target=errorFocusTarget(error);target?.scrollIntoView({block:'center'});target?.focus()});li.append(a);list.append(li);if(error.code==='outlier_confirmation'&&error.field.startsWith('resources.')){$(error.field.split('.')[1]+'-outlier').classList.remove('hidden')}});summary.classList.remove('hidden');summary.focus()}
function showStep(step){currentStep=step;document.querySelectorAll('.step').forEach(el=>el.classList.add('hidden'));$('step-'+step).classList.remove('hidden');for(let i=1;i<=4;i++){const dot=$('dot-'+i);dot.className=i<step?'done':i===step?'active':'';dot.setAttribute('aria-current',i===step?'step':'false')}clearErrors();$('init-card').scrollTop=0;$('step-'+step+'-title').focus()}
function selectLanguage(lang){selectedLang=lang;document.querySelectorAll('.language-button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===lang)));$('btn-step1-next').disabled=false;applyTranslations();if(lastSummary)populateSummary(lastSummary);if(!$('immediate-danger-dialog').classList.contains('hidden'))updateDanger()}
function explicitFact(id){const value=$(id).value;if(value==='unknown')return {status:'unknown'};return {status:'known',value}}
function collectAssessment(){const peopleState=document.querySelector('input[name="people-state"]:checked')?.value;const people=peopleState==='known'?{status:'known',value:$('people-count').value}:{status:peopleState};const threatState=document.querySelector('input[name="threat-state"]:checked')?.value;const threats={status:threatState,values:threatState==='selected'?Array.from(document.querySelectorAll('#threat-options input:checked')).map(input=>input.value):[]};const resources={};document.querySelectorAll('.resource-panel').forEach(panel=>{const type=panel.dataset.resource,amountState=document.querySelector(`input[name="${type}-amount-state"]:checked`)?.value,rateState=document.querySelector(`input[name="${type}-rate-state"]:checked`)?.value;const resource={status:amountState,rates:{status:rateState},confirm_outlier:$(type+'-confirm-outlier').checked};if(amountState==='known')resource.amount=$(type+'-amount').value;if(rateState==='estimate'){resource.rates.basis='group_total';resource.rates.daily_consumption=$(type+'-consumption').value;resource.rates.daily_intake=$(type+'-intake').value}resources[type]=resource});return {people_count:people,health:explicitFact('health'),urgency:explicitFact('urgency'),shelter:explicitFact('shelter'),threats,resources,confirmed:false}}
function localSituationErrors(){const errors=[];const peopleState=document.querySelector('input[name="people-state"]:checked')?.value;if(!peopleState)errors.push({field:'people_count',code:'explicit_status_required'});else if(peopleState==='known'&&!$('people-count').value)errors.push({field:'people_count',code:'not_integer'});['health','urgency','shelter'].forEach(id=>{if(!$(id).value)errors.push({field:id,code:'explicit_status_required'})});const threatState=document.querySelector('input[name="threat-state"]:checked')?.value;if(!threatState)errors.push({field:'threats',code:'threat_status_required'});else if(threatState==='selected'&&!document.querySelector('#threat-options input:checked'))errors.push({field:'threats',code:'threat_selection_required'});return errors}
async function api(path,options={}){const response=await fetch(path,options);let payload={};try{payload=await response.json()}catch(error){payload={detail:String(error)}}if(!response.ok){const problem=new Error(payload.detail||response.statusText);problem.payload=payload;problem.status=response.status;throw problem}return payload}
function handleApiError(error){const errors=error.payload?.errors||[{field:'assessment',code:'object_required'}];const planError=error.payload?.error==='invalid_survival_plan';const resourceError=errors.some(item=>item.field.startsWith('resources.'));showStep(planError?4:resourceError?3:2);showErrors(errors)}
function localizedUnit(domain){return tr('resource_unit_'+domain)}
function displayValue(fact){if(fact.domain==='threats'){if(fact.status==='none')return tr('init_assessment_threat_none');return fact.value.map(value=>tr('q_threat_'+({extreme_weather:'weather',structural_collapse:'collapse',fire_risk:'fire',human_threat:'human'}[value]||value))).join(', ')}const keyMaps={health:'q_health_',urgency:'q_urgency_',shelter:'q_shelter_'};const prefixes=keyMaps[fact.domain];if(prefixes){const suffix={minor_injury:'minor',serious_injury:'serious',chronic_condition:'chronic',immediate_danger:'immediate',stable_but_urgent:'urgent',permanent_building:'permanent',temporary_shelter:'temporary',open_air:'open_air'}[fact.value]||fact.value;return tr(prefixes+suffix)}return String(fact.value)+(fact.unit?' '+localizedUnit(fact.domain):'')}
function populateSummary(summary){const known=$('summary-known'),unknown=$('summary-unknown'),resources=$('summary-resources');known.replaceChildren();unknown.replaceChildren();resources.replaceChildren();summary.known.forEach(fact=>{const li=document.createElement('li');li.textContent=tr('assessment_field_'+fact.domain)+': '+displayValue(fact);known.append(li)});const localizedTime=new Date(summary.as_of).toLocaleString(selectedLang==='zh'?'zh-CN':'en-US');const time=document.createElement('li');time.textContent=tr('assessment_field_as_of')+': '+localizedTime;known.append(time);summary.resources.forEach(resource=>{const li=document.createElement('li'),unit=localizedUnit(resource.domain),amount=resource.amount_status==='known'?resource.amount+' '+unit:tr('init_assessment_unknown'),basis=resource.rate_basis==='group_total'?tr('web_init_group_total_basis'):tr('init_assessment_unknown'),rate=resource.rate_status==='estimate'?tr('web_init_rate_summary').replace('{consumption}',resource.daily_consumption+' '+unit+'/'+tr('web_init_day_short')).replace('{intake}',resource.daily_intake+' '+unit+'/'+tr('web_init_day_short')).replace('{source}',tr('resource_source_'+resource.source))+' · '+basis:tr('init_assessment_rate_unknown');li.textContent=tr('assessment_field_'+resource.domain)+': '+tr('web_init_amount_summary').replace('{amount}',amount)+'; '+rate+'; '+tr('assessment_field_as_of')+' '+localizedTime;resources.append(li)});summary.unknown.forEach(domain=>{const li=document.createElement('li'),rate=domain.endsWith('_rate'),base=rate?domain.slice(0,-5):domain;li.textContent=tr('assessment_field_'+base)+(rate?tr('init_assessment_rate_suffix'):'');unknown.append(li)})}
function planText(key,domain){return tr(key).replace('{domain}',tr('assessment_field_'+domain))}
function populatePlan(plan){const primary=$('plan-primary-options'),secondary=$('plan-secondary-list'),primaryIds=new Set(plan.primary_candidate_ids);primary.replaceChildren();secondary.replaceChildren();$('plan-phase').textContent=tr(plan.phase_status==='known'?'phase_desc_'+plan.phase:'phase_desc_unknown');plan.actions.filter(action=>primaryIds.has(action.id)).forEach(action=>{const label=document.createElement('label'),radio=document.createElement('input'),copy=document.createElement('span'),title=document.createElement('strong'),why=document.createElement('span'),prerequisite=document.createElement('span'),done=document.createElement('span'),risk=document.createElement('span'),reassess=document.createElement('span');label.className='plan-option';radio.type='radio';radio.name='primary-action';radio.value=action.id;radio.checked=selectedPrimaryActionId===action.id;copy.className='plan-copy';title.textContent=planText(action.title_key,action.domain);why.textContent=tr('survival_plan_why_label')+': '+planText(action.why_now,action.domain);prerequisite.textContent=tr('survival_plan_prerequisite_label')+': '+action.prerequisites.map(key=>planText(key,action.domain)).join('; ');done.textContent=tr('survival_plan_done_label')+': '+planText(action.done_when,action.domain);risk.className='plan-risk';risk.textContent=tr('web_init_plan_risk_label')+': '+planText(action.risk,action.domain);reassess.textContent=tr(action.reassess_at==='PT1H'?'survival_plan_reassess_1h':action.reassess_at==='PT4H'?'survival_plan_reassess_4h':'survival_plan_reassess_24h');copy.append(title,why,prerequisite,done,risk,reassess);label.append(radio,copy);primary.append(label)});plan.actions.filter(action=>!primaryIds.has(action.id)).forEach(action=>{const li=document.createElement('li');li.textContent=planText(action.title_key,action.domain)+' — '+planText(action.why_now,action.domain);secondary.append(li)});$('plan-secondary').classList.toggle('hidden',secondary.children.length===0)}
function updateCompleteState(){$('btn-complete').disabled=!($('assessment-confirmed').checked&&selectedPrimaryActionId)}
async function reviewAssessment(){clearErrors();const assessment=collectAssessment();try{const result=await api('/api/init/assessment/preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({language:selectedLang,assessment})});assessment.as_of=result.summary.as_of;lastAssessment=assessment;lastSummary=result.summary;lastPlan=result.plan;selectedPrimaryActionId=null;populateSummary(lastSummary);populatePlan(lastPlan);$('assessment-confirmed').checked=false;updateCompleteState();showStep(4)}catch(error){handleApiError(error)}}
async function completeInit(){if(!lastAssessment||!lastPlan||!$('assessment-confirmed').checked||!selectedPrimaryActionId)return;const button=$('btn-complete');button.disabled=true;lastAssessment.confirmed=true;try{await api('/api/init/complete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({language:selectedLang,assessment:lastAssessment,plan_id:lastPlan.id,primary_action_id:selectedPrimaryActionId,skills:[]})});window.location.reload()}catch(error){lastAssessment.confirmed=false;button.disabled=false;handleApiError(error)}}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;if(action==='language')selectLanguage(target.dataset.lang);else if(action==='next')showStep(Number(target.dataset.next));else if(action==='back')showStep(Number(target.dataset.next));else if(action==='situation-next'){const errors=localSituationErrors();if(errors.length)showErrors(errors);else showStep(3)}else if(action==='review')reviewAssessment();else if(action==='complete')completeInit();else if(action==='danger-open')openDanger(target);else if(action==='danger-close')closeDanger();else if(action==='danger-choice'){target.closest('[role=group]')?.querySelectorAll('button').forEach(button=>{button.disabled=true});$('immediate-danger-back').disabled=true;dangerHistory.push({...dangerFacts});dangerFacts[target.dataset.field]=target.dataset.value;updateDanger()}else if(action==='danger-back'){target.disabled=true;dangerGeneration++;dangerFacts=dangerHistory.pop()||{};updateDanger()}});
document.addEventListener('change',event=>{const input=event.target;if(input.name==='people-state'){const known=input.value==='known';$('people-count').disabled=!known;if(!known)$('people-count').value=''}if(input.name==='threat-state'){$('threat-options').classList.toggle('hidden',input.value!=='selected');if(input.value!=='selected')document.querySelectorAll('#threat-options input').forEach(box=>box.checked=false)}const amountMatch=input.name?.match(/^(.+)-amount-state$/);if(amountMatch){const field=$(amountMatch[1]+'-amount');field.disabled=input.value!=='known';if(input.value!=='known')field.value=''}const rateMatch=input.name?.match(/^(.+)-rate-state$/);if(rateMatch){const type=rateMatch[1],estimate=input.value==='estimate';$(type+'-rate-fields').classList.toggle('hidden',!estimate);[type+'-consumption',type+'-intake'].forEach(id=>{$(id).disabled=!estimate;if(!estimate)$(id).value=''})}if(input.name==='primary-action')selectedPrimaryActionId=input.value;if(input.id==='assessment-confirmed'||input.name==='primary-action')updateCompleteState()});
function renderHardwareSummary(){const element=$('hardware-summary');if(!hardwareRequested){element.textContent=tr('web_init_hardware_not_requested');return}if(!hardwareInfo){element.textContent=tr('web_init_hardware_loading');return}if(hardwareInfo.error){element.textContent=tr('web_init_hardware_unavailable');return}element.textContent=tr('web_init_hardware_summary').replace('{ram}',String(hardwareInfo.ram_total_gb)).replace('{tier}',String(hardwareInfo.tier))}
$('hardware-details').addEventListener('toggle',()=>{if(!$('hardware-details').open||hardwareRequested)return;hardwareRequested=true;renderHardwareSummary();api('/api/init/hardware').then(info=>{hardwareInfo=info;renderHardwareSummary()}).catch(()=>{hardwareInfo={error:true};renderHardwareSummary()})});
document.addEventListener('keydown',event=>{if($('immediate-danger-dialog').classList.contains('hidden'))return;if(event.key==='Escape'){event.preventDefault();closeDanger();return}if(event.key!=='Tab')return;const focusable=Array.from($('immediate-danger-dialog').querySelectorAll('button:not([disabled]),[tabindex="0"]')).filter(el=>!el.classList.contains('hidden'));if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}});
showStep(1);selectLanguage((navigator.language||'en').toLowerCase().startsWith('zh')?'zh':'en');
</script>
