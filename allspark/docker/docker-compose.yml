version: "3.8"

services:
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    container_name: allspark-core
    volumes:
      - allspark-data:/root/.allspark
    restart: unless-stopped

  llm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.llm
    container_name: allspark-llm
    ports:
      - "11434:11434"
    volumes:
      - allspark-models:/models
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    profiles:
      - full

  rag:
    image: qdrant/qdrant:latest
    container_name: allspark-rag
    ports:
      - "6333:6333"
    volumes:
      - allspark-rag:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    profiles:
      - full

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: allspark-web
    ports:
      - "8080:8080"
    depends_on:
      - core
    restart: unless-stopped

  kiwix:
    image: kiwix/kiwix-serve:latest
    container_name: allspark-kiwix
    ports:
      - "8081:80"
    volumes:
      - allspark-kiwix:/data
    restart: unless-stopped
    profiles:
      - full

volumes:
  allspark-data:
  allspark-models:
  allspark-rag:
  allspark-kiwix:
