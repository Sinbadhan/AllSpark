- id: agriculture/composting/system/en
  category: agriculture
  subcategory: composting
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Composting System
  summary: Sustainable agriculture needs steady nutrient replacement. Composting turns
    organic waste into high-quality fertilizer — the cornerstone of self-sufficient
    farming.
  steps:
  - "Choose a shaded, ventilated spot; build a 1m x 1m x 1m bin (wood/bamboo/brick)"
  - "Layer: brown layer (dry leaves/straw/paper) → green layer (veg scraps/grass/manure) → thin soil"
  - "Brown-to-green ratio about 3:1; keep moist but not waterlogged"
  - "Turn the pile every 1-2 weeks to introduce air and speed decomposition"
  - "Internal temp should reach 55-65°C (too hot to hold for more than a few seconds; a thermometer is best)"
  - "Done in 2-6 months — dark brown, crumbly, soil-like"
  prerequisites:
  - "Organic waste"
  - "Composting space"
  - "Turning tool"
  warnings:
  - "Do not add meat, oil, or diseased plants — they attract pests and spread disease"
  - "Below 55°C the pile won't kill pathogens and weed seeds"
  - "Cat/dog feces may carry parasites — avoid"
  verification: field_tested
  source: pre_collapse
  language: en
- id: agriculture/seed_saving/techniques/en
  category: agriculture
  subcategory: seed_saving
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Seed Saving Techniques
  summary: Seeds are the lifeblood of agriculture. Mastering seed saving lets you keep
    planting without relying on external supply.
  steps:
  - "Select the healthiest plants for seed, mark them to avoid accidental harvest"
  - "Wait until fruit is fully mature before collecting seed"
  - "Wet seed (tomato/cucumber): ferment the scooped seeds with their juice at room temp 2-4 days until the gel dissolves, then wash clean and dry"
  - "Dry seed (beans/grains): dry pods/ears on the plant, then thresh"
  - "Drying: air-dry in a cool ventilated spot 7-14 days to below 8% moisture"
  - "Storage: paper bags or sealed jars with desiccant, in a cool dry place"
  - "Label variety, date, source"
  prerequisites:
  - "Mature crops"
  - "Drying space"
  - "Storage containers"
  warnings:
  - "Hybrid (F1) seed segregates in offspring — prefer open-pollinated varieties"
  - "Excess moisture causes mold"
  - "Different brassica varieties cross-pollinate — isolate them"
  verification: field_tested
  source: pre_collapse
  language: en
- id: chemistry/paper/making/en
  category: chemistry
  subcategory: paper
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Handmade Paper
  summary: Paper is the foundation of recording and transmitting knowledge. Make paper
    from plant fiber to carry civilization's memory forward.
  steps:
  - "Collect fiber: scrap paper/straw/hemp/bark (paper mulberry bark is best)"
  - "Soak the material 1-2 days to soften"
  - "Boil in lye (wood-ash water) 2-4h to break down lignin"
  - "Wash thoroughly to remove lye"
  - "Beat to pulp with a hammer/stone mortar"
  - "Dilute pulp with water; add binder (sunset hibiscus/starch paste)"
  - "Pull a sheet with a mold (wooden frame + fine mesh) — dip level and lift"
  - "Couch onto a flat board, press out water, dry"
  prerequisites:
  - "Plant fiber"
  - "Wood ash"
  - "Paper mold"
  - "Plenty of water"
  warnings:
  - "Boiling lye needs ventilation and protection"
  - "Do not use aluminum pots (lye corrodes aluminum and contaminates pulp); use iron/stainless-steel/enamelware; lye corrodes skin — rinse immediately on contact"
  - "Pulp concentration sets sheet thickness — thin when dilute, thick when concentrated"
  - "Avoid direct sun while drying to prevent warping"
  verification: field_tested
  source: pre_collapse
  language: en
- id: chemistry/dye/natural/en
  category: chemistry
  subcategory: dye
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Natural Dye Extraction
  summary: Natural dyes color and mark. Different plants yield different hues — indigo
    (blue), madder (red), cork tree (yellow).
  steps:
  - "Blue: ferment indigo plant leaves (Persicaria tinctoria / Strobilanthes cusia — Japanese indigo / woad), add lye to make indigo; reduce the insoluble indigo to soluble leuco form (traditionally with lime + reducing agent / fermentation), dye then oxidize in air to blue; indigo does not use the mordant process"
  - "Red: chop madder root, soak in hot water to extract alizarin"
  - "Yellow: hot-water extract of cork-tree bark/pomegranate peel/onion skins"
  - "Black: gallnuts (insect galls) with iron mordant"
  - "Mordants: alum (aluminum), rusty water (iron), wood ash (alkaline)"
  - "Dye sequence: mordant → rinse → dye → rinse → dry"
  prerequisites:
  - "Dye plants"
  - "Mordant"
  - "Water"
  - "Containers"
  warnings:
  - "Some dye plants are toxic — wash hands after handling"
  - "Iron mordant darkens color — mind the amount"
  - "Natural dyes have lower colorfastness than chemical dyes — re-dip to deepen"
  verification: field_tested
  source: pre_collapse
  language: en
- id: mechanical/watermill/simple/en
  category: mechanical
  subcategory: watermill
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Simple Watermill
  summary: Use flowing water to grind grain and saw wood. Water power is a sustainable
    mechanical energy source.
  steps:
  - "Site: a stream with steady flow and 0.5-2m of head"
  - "Build the wheel: wooden disc 1-2m across, with buckets around the rim"
  - "Type: 0.5m low head uses undershot (water strikes buckets at the bottom); overshot (water onto the top) only above 1.5m head"
  - "Mount the wheel on a horizontal shaft, buckets facing the flow"
  - "Connect the millstone: wheel shaft drives the upper stone via gears"
  - "Channel water: a flume directs water to the top of the wheel"
  - "Maintain: check bearings for lubrication and wood for rot regularly"
  prerequisites:
  - "Stream"
  - "Timber"
  - "Millstone"
  - "Basic carpentry"
  warnings:
  - "Floods can destroy the wheel — reinforce before rainy season"
  - "Wooden bearings need frequent lubrication (animal fat/graphite)"
  - "Shattered millstones can fly out — set up guards"
  verification: field_tested
  source: pre_collapse
  language: en
- id: mechanical/bicycle_generator/en
  category: mechanical
  subcategory: generator
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Bicycle Generator
  summary: Convert a scrap bicycle and a generator into a human-powered generator to
    charge small devices and light a lamp.
  steps:
  - "Obtain a scrap bicycle and a DC/alternator generator"
  - "Mount the generator beside the rear wheel"
  - "Connect wheel and generator with a belt or friction roller"
  - "Wire a rectifier and regulator circuit (12V system)"
  - "Connect a battery to store power (lead-acid is easiest to find)"
  - "Pedal to generate: moderate speed yields 50-100W"
  prerequisites:
  - "Bicycle"
  - "Generator"
  - "Rectifier"
  - "Battery"
  - "Basic circuit knowledge"
  warnings:
  - "Generator voltage is unstable — always regulate before connecting devices"
  - "Lead-acid batteries emit hydrogen while charging — ventilate, keep away from flame"
  - "Long pedaling sessions are exhausting — not for the frail"
  verification: field_tested
  source: pre_collapse
  language: en
- id: weather/shelter/climate_design/en
  category: weather
  subcategory: shelter
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Climate-Adaptive Shelter Design
  summary: Long-term settlement requires shelters designed for the local climate. Different
    climates need different insulation, ventilation, and waterproofing strategies.
  steps:
  - "Cold regions: thick walls (earth/stone/wattle-and-daub), small south-facing windows, insulated double roof, underfloor heating flue"
  - "Hot and humid: stilt houses against damp, wide eaves for shade, cross-ventilation, bamboo/wood structure"
  - "Hot and dry: thick earth walls for thermal mass, small windows to cut radiant heat, courtyard layout, underground storage"
  - "Wet regions: steep roofs, deep eaves, damp-proof course, drainage ditches"
  - "Typhoon regions: low profile, tied and braced, leeward siting"
  prerequisites:
  - "Local climate data"
  - "Building materials"
  - "Tools"
  warnings:
  - "Site above the flood line, away from landslide slopes and wind funnels"
  - "Flues/fireplaces must vent correctly — carbon monoxide is silently lethal"
  - "Adobe buildings in seismic zones need reinforcement (bamboo/wood frame)"
  verification: field_tested
  source: pre_collapse
  language: en
- id: energy/wind/basic_turbine/en
  category: energy
  subcategory: wind
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Simple Wind Turbine
  summary: Wind is a sustainable energy source. Build a small wind generator from simple
    materials to power lighting and comms.
  steps:
  - "Site: open high ground, average wind 4m/s or more"
  - "Blades: split PVC pipe / wood / sheet metal, 3-blade design"
  - "Hub: metal disc holding blades, centered on the generator shaft"
  - "Generator: permanent-magnet DC motor (scrap auto/bike motor)"
  - "Tower: 4-6m steel pipe or wood pole, secured with guy wires"
  - "Electrical: rectifier → regulator → battery → inverter (if AC needed)"
  - "Maintain: check blades, bearings, and connections regularly"
  prerequisites:
  - "Generator"
  - "Blade material"
  - "Tower"
  - "Rectifier/regulator circuit"
  warnings:
  - "The tower must be solidly anchored — collapse is lethal"
  - "Disconnect electrical lines in thunderstorms to avoid lightning strikes"
  - "Spinning blades are a cutting hazard — set a safety perimeter"
  - "Brake or lower blades above the design wind limit"
  - "PVC blades grow brittle in winter and age — replace as needed; the throw zone is a 2× tower-height radius around the base"
  verification: field_tested
  source: pre_collapse
  language: en
- id: energy/biogas/digester/en
  category: energy
  subcategory: biogas
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Biogas Digester
  summary: Biogas is combustible gas from anaerobic digestion of organic waste. The
    effluent is excellent fertilizer — two benefits at once.
  steps:
  - "Site: near animal pens/toilets, where the water table is low"
  - "Build: brick/stone cylindrical tank of 6-10m³, with feed, digestion, and gas chambers"
  - "Seal: plaster the inner wall 3 times with cement mortar — gas- and water-tight"
  - "Charge: manure + chopped straw + water, 8-10% solids"
  - "Start: add old biogas slurry or cow manure as inoculum, seal and ferment"
  - "Gas: production begins in 7-15 days; a blue flame means it's on spec"
  - "Temperature: mesophilic fermentation optimum 25-38°C (ideally 35°C); below 15°C it nearly stops"
  - "Daily: feed daily, desludge periodically, keep pH 6.8-7.5"
  prerequisites:
  - "Building materials (brick/cement)"
  - "Organic waste"
  - "Labor"
  warnings:
  - "Biogas contains methane and hydrogen sulfide — suffocation and explosion risk"
  - "Never smoke or use open flame near the digester"
  - "Ventilate and post multiple watchers before entering for repair — the tank is oxygen-deficient and lethal"
  - "Output drops in cold weather — insulate in winter"
  - "Gas-holder pressure is auto-regulated by the water-pressure chamber — never seal a dead volume; fit a flame arrestor at the output to prevent flashback"
  verification: field_tested
  source: pre_collapse
  language: en
- id: medicine/herbal/common/en
  category: medicine
  subcategory: herbal
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Common Herbs and Their Uses
  summary: When medicine runs short, common herbs can treat basic complaints. But identification
    must be exact — misuse can be fatal.
  steps:
  - "Fever: chaihu (Bupleurum root, decoction), mint (leaf tea)"
  - "Bleeding: sanqi (powder, topical), bletilla (powder on wound)"
  - "Inflammation: honeysuckle (flower infusion), dandelion (whole-plant decoction)"
  - "Diarrhea: pomegranate peel (decoction), plantain (leaf decoction)"
  - "Parasites: mugwort (smoke/infusion), garlic (raw)"
  - "Pain: yanhusuo (root decoction), chuanxiong (root decoction)"
  - "Dose: 3-9g dried herb per day for adults as decoction; do not decoct in an iron pot (tannin reaction); sanqi/bletilla powder is for superficial application only — never pack into deep wounds"
  prerequisites:
  - "Herb identification skill"
  - "Reference guide"
  warnings:
  - "Never use a plant you cannot identify with 100% certainty — poison can kill"
  - "Herb dosing is imprecise — start small"
  - "Use herbs cautiously in pregnant women, children, and the frail"
  - "Herbs cannot replace professional care — emergency use only"
  verification: field_tested
  source: pre_collapse
  language: en
- id: weather/extreme/storm_response/en
  category: weather
  subcategory: extreme
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Extreme Weather Response
  summary: Thunderstorms, floods, and high winds are common deadly weather after a
    collapse. Standardized sheltering actions for each scenario let you make life-saving
    decisions in seconds.
  steps:
  - 'Thunderstorm: crouch in a low spot immediately, feet together, head down; stay away from metal, high ground, isolated trees, and water; do not touch appliances or power lines'
  - 'Lightning posture: crouch, feet together, hands on head, chest off the ground — reduces step voltage and target profile'
  - 'Flood: move to high ground immediately; never wade (current speed and depth are deceptive); abandon a car in floodwater and head uphill'
  - 'Flash-flood signs: upstream rain, sudden rise, muddy water, floating debris → flash flood within minutes'
  - 'High wind: reinforce roof and doors/windows (ropes/weights); move to an interior room or basement; stay away from windows and glass'
  - 'Tornado: shelter in a basement or small interior room, protect head and neck; outdoors, lie flat in a depression'
  - 'General: monitor warnings early, prepare a go-bag, agree on a rally point and a lost-contact plan'
  prerequisites:
  - Weather warning information
  - Go-bag
  - Escape routes
  warnings:
  - 'Do not shelter under bridges or culverts in floods — water rises fast and they become death traps'
  - 'In thunderstorms do not use wired appliances or phones; stay away from metal pipes and water'
  - 'After high wind, watch for structural damage, downed power lines, and electrified standing water'
  - 'Never wade across unknown currents — 30 cm of water can knock an adult down'
  verification: field_tested
  source: pre_collapse
  language: en
- id: medicine/public_health/sanitation/en
  category: medicine
  subcategory: public_health
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Public Health and Environmental Sanitation
  summary: In disaster settings disease is deadlier than trauma. Systematic management
    of excreta, water sources, waste, and isolation is the foundation of community
    public health.
  steps:
  - 'Excreta: deep-pit latrines (30m+ from water, cover with 0.5m+ soil), or composting toilets with separation'
  - 'Water source protection: zone off drinking water sources, no washing or sewage, fence and sign'
  - 'Disease isolation: single-room isolation for anyone with infectious symptoms, dedicated caregiver, log contacts'
  - 'Handwashing: after toileting, after patient contact, before food handling — use soap or ash water'
  - 'Waste: compost organics, burn or bury inorganics, incinerate medical waste separately'
  - 'Vector control: drain standing water against mosquitoes, seal food against rodents, daily trash removal against flies'
  prerequisites:
  - Digging tools
  - Isolation space
  - Soap or ash water and other disinfectant substitutes
  warnings:
  - On outbreak, isolate patients immediately and trace contacts; log to AllSpark
  - Severe situations — seek professional medical care immediately
  - Drinking water must be boiled or filtered and disinfected
  - Medical waste must never be mixed with household waste
  verification: unverified
  source: pre_collapse
  language: en
- id: medicine/first_aid/burns/en
  category: medicine
  subcategory: first_aid
  priority: 2
  risk_level: pending_review
  hazards: [unknown]
  review_status: pending_external_review
  title: Burn and Scald First Aid
  summary: Burns are a common emergency injury. Correct handling limits damage and
    prevents infection. This entry is first-aid common sense only — no drug dosages.
  steps:
  - 'Cooling: immediately rinse the burn under cool running water for 15-20 minutes to reduce deep tissue damage'
  - 'Cooling notes: do not apply ice directly (frostbite on top of burn); do not apply toothpaste, soy sauce, butter, or folk remedies'
  - 'Blisters: do not pop them — intact blisters are a natural protective layer; cover broken blisters loosely with clean gauze'
  - 'Cover: loosely cover with clean lint-free cloth or cling film to reduce infection and pain'
  - 'Severity: area larger than a palm, face/hands/feet/genitals/joints, chemical or electrical burns — seek care immediately'
  - 'Chemical burns: flush with copious water for 15+ minutes before seeking care'
  prerequisites:
  - Cool running water
  - Clean lint-free cloth or cling film
  - Clean environment
  warnings:
  - Large-area, facial, or airway burns are life-threatening — seek professional medical care immediately
  - Severe situations — seek professional medical care immediately
  - Do not tear clothing stuck to the wound — cut around it
  - Do not apply any folk remedy, oil, or spice — they increase infection risk
  verification: unverified
  source: pre_collapse
  language: en
