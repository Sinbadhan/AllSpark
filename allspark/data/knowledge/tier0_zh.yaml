- id: survival/water/purification/boiling
  category: survival
  subcategory: water
  priority: 0
  title: 煮沸净水法
  summary: 最可靠的净水方法。将水煮沸可杀灭绝大多数病原体。低海拔（2000m以下）煮沸1分钟，高海拔（2000m以上）煮沸3分钟。
  steps:
  - 找到可加热的金属容器（罐头盒、铝壶等）
  - 用粗布或衣物过滤大颗粒杂质
  - 将水加热至沸腾（大泡翻滚）
  - 低海拔（2000m以下）保持沸腾1分钟，高海拔（2000m以上）保持3分钟
  - 静置冷却后饮用
  prerequisites:
  - 可加热容器
  - 热源
  warnings:
  - 煮沸不能去除化学污染物
  - 水必须完全沸腾，小泡不算
  - 冷却时注意不要被二次污染
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/water/purification/filter
  category: survival
  subcategory: water
  priority: 0
  title: 简易过滤净水法
  summary: 使用分层材料制作简易过滤器，可去除大部分悬浮物和部分微生物。可与煮沸法结合使用。
  steps:
  - 取塑料瓶或中空竹筒，底部戳小孔
  - 从下到上依次放入：细沙→粗沙→小石子→木炭→小石子→粗沙→细沙
  - 每层约3-5厘米厚
  - 木炭层需用冷却的篝火炭，敲碎后使用
  - 从顶部倒入待过滤水，底部收集
  - 过滤后的水仍需煮沸才能安全饮用
  prerequisites:
  - 塑料瓶/竹筒等容器
  - 沙、石、木炭
  warnings:
  - 简易过滤不能完全杀菌，必须煮沸后再饮用
  - 木炭需冷却后使用，热的木炭无效
  - 定期更换过滤材料
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/water/finding/surface
  category: survival
  subcategory: water
  priority: 0
  title: 寻找地表水源
  summary: 在野外寻找地表水源的方法：观察地势、植被、动物行为。水往低处流，谷底和山脚最可能有水。
  steps:
  - 向地势最低处（谷底、山脚）行进
  - 观察植被——茂密绿色植被区可能有地下水
  - 注意动物足迹和鸟类活动——它们需要饮水
  - 注意昆虫——蜜蜂和蚂蚁通常不会离水太远
  - 听水声——流水声和蛙鸣声
  - 注意岩石渗水和湿地面
  prerequisites:
  - 无
  warnings:
  - 死水（不流动的水）风险更高，必须净化后饮用
  - 水色异常（绿/黄/白浊）需特别处理
  - 工业区附近的水可能有化学污染，煮沸无法去除
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/water/finding/plant
  category: survival
  subcategory: water
  priority: 0
  title: 从植物获取水分
  summary: 某些植物可以作为水源。清晨露水、多汁植物、竹子、藤蔓等均可提供水分。
  steps:
  - 清晨收集草叶上的露水：用布绑在脚上走过草地，然后拧出水分
  - 竹子：砍断竹节，倾斜倒出储水
  - 藤蔓：切断后从切口处收集滴出的水
  - 仙人掌：切开取汁（需确认品种可食用）
  - 椰子：嫩椰子含大量水分
  prerequisites:
  - 识别当地可用水源植物
  warnings:
  - 不确定的植物汁液可能有毒
  - 白色乳汁植物通常有毒，避免使用
  - 从植物获取的水量有限，不能作为唯一水源
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/water/finding/rain
  category: survival
  subcategory: water
  priority: 0
  title: 雨水收集
  summary: 雨水是最安全的天然水源之一。收集方法简单，可利用任何大面挡水材料。
  steps:
  - 寻找最大面积的不透水材料（塑料布、雨衣、帐篷等）
  - 在材料中间放置重物，形成漏斗状
  - 最低处放置容器收集
  - 雨开始几分钟的雨水先不要收集（冲洗空气尘埃）
  - 收集的雨水最好煮沸后饮用
  prerequisites:
  - 大面防水材料
  - 容器
  warnings:
  - 酸雨区域雨水可能有化学污染
  - 收集容器必须干净
  - 雨后尽快收集，不要让水滞留过久
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/fire/methods/flint
  category: survival
  subcategory: fire
  priority: 0
  title: 打火石取火法
  summary: 使用打火石（镁棒）是最可靠的野外取火方式之一，不受潮湿影响，可重复使用数千次。
  steps:
  - 准备引火物：干燥的草、树皮碎屑、棉花、干苔藓
  - 将引火物整理成鸟巢状，放在打火板或平整石面上
  - 一手握住镁棒，另一手持刮刀/刀背
  - 刀刃以45度角用力刮擦镁棒
  - 火花落入引火物后，轻吹使其点燃
  - 点燃后逐渐加入细枝，再加粗枝
  prerequisites:
  - 打火石/镁棒
  - 金属刮刀/刀背
  - 干燥引火物
  warnings:
  - 保持引火物绝对干燥
  - 刮擦方向远离自己
  - 风大时注意用身体挡风
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/fire/methods/bow_drill
  category: survival
  subcategory: fire
  priority: 0
  title: 弓钻取火法
  summary: 最经典的摩擦取火法。需要弓、钻杆、底板和轴承石。原理是摩擦生热点燃木屑。
  steps:
  - 制作弓：找一根约60cm的弯木棍，两端绑上绳索（鞋带、藤蔓等）
  - 制作钻杆：直木棍，约20cm长，直径1-2cm，顶端削尖
  - 制作底板：干燥软木板，刻一个V形凹槽
  - 制作轴承石/木：硬木或石头，刻一个凹槽压住钻杆顶部
  - 将绳索绕钻杆一圈，钻杆底部放入底板凹槽
  - 前后拉弓使钻杆快速旋转，直到产生浓烟
  - 看到红色余烬后，小心收集到底板下的引火物上
  - 轻吹引火物使其点燃
  prerequisites:
  - 干燥软木
  - 绳索/鞋带
  - 刀具
  warnings:
  - 所有木料必须干燥，湿木无法成功
  - 底板用软木（杨树/柳树/雪松），钻杆用硬木或同类
  - 此方法需要练习，首次可能需要1小时以上
  - 注意不要让轴承石过热烫伤手
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/fire/methods/battery
  category: survival
  subcategory: fire
  priority: 0
  title: 电池取火法
  summary: 利用电池短路产生高温点燃引火物。9V电池或多节AA/AAA碱性电池组配合钢丝棉或细导线即可（严禁锂电池，有爆炸风险）。
  steps:
  - 找到3V以上电池和钢丝棉或极细导线
  - 将钢丝棉展开拉松，放置在引火物上
  - 将电池正负极同时接触钢丝棉
  - 钢丝棉会立即发红燃烧
  - 迅速将引火物靠近火苗
  - 火势稳定后加入更多燃料
  prerequisites:
  - 3V以上电池
  - 钢丝棉或细导线
  - 引火物
  warnings:
  - 不要用锂电池尝试（可能爆炸）
  - 操作时远离面部
  - 钢丝棉燃烧速度快，动作要快
  - 电池取火是一次性的，确保有把握再尝试
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/fire/fuel/types
  category: survival
  subcategory: fire
  priority: 0
  title: 燃料类型与选择
  summary: 不同燃料有不同特性。干柴是最常用燃料，紧急时动物粪便、油脂等也可使用。
  steps:
  - 干柴：最优燃料。立着折断的树枝说明已干透，地上捡的多为潮湿
  - 动物粪便：干燥的牛粪是优质燃料，燃烧缓慢且持久
  - 油脂/脂肪：动物脂肪可做灯油，用容器盛放加灯芯燃烧
  - 松脂/松明：含松脂的松木（松明）极易点燃，是最好的引火物
  - 煤炭/泥炭：发现后可储存，燃烧持久
  - 城市废墟：木制家具、纸张、塑料均可燃烧（注意有毒烟气）
  prerequisites:
  - 无
  warnings:
  - 塑料和化学品燃烧可能产生有毒气体，在通风处使用
  - 湿柴会产生大量烟雾，尽量找干柴
  - 不要在密闭空间内生火——一氧化碳中毒致命
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/fire/building/types
  category: survival
  subcategory: fire
  priority: 0
  title: 火堆搭建类型
  summary: 不同用途需要不同火堆：锥形火堆适合快速取暖，星形火堆节省燃料，长火适合多人取暖。
  steps:
  - 锥形火堆（最常用）：引火物居中，细枝围成锥形，逐渐加粗——适合快速点燃和取暖
  - 星形火堆：粗木柴呈放射状排列，火在中心燃烧——最省燃料，适合长时间维持
  - 长火/沟火：在地面挖浅沟，两侧放粗木——适合多人取暖和烹饪
  - 反射墙火堆：火堆一侧用石头/土堆成反射墙——热量向一个方向集中，适合庇护所前使用
  - 达科他火洞：地面挖洞加侧通风道——烟雾少、效率高、隐蔽性好
  prerequisites:
  - 干燥燃料
  - 引火物
  warnings:
  - 火堆远离易燃物至少2米
  - 风大时选择避风处或挖坑生火
  - 睡前确保火已完全熄灭或用石头围好
  - 永远不要在帐篷内生火
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/food/plants/edible_common
  category: survival
  subcategory: food
  priority: 0
  title: 常见可食用野菜识别
  summary: 以下野菜广泛分布且容易识别：蒲公英、马齿苋、野蒜、蕨菜、荠菜。它们是野外最容易获取的食物来源。
  steps:
  - 蒲公英：全株可食。叶子可生食或煮食，花可泡茶，根可烤制代咖啡
  - 马齿苋：茎叶均可食，富含Omega-3。可生食或煮汤，味道微酸
  - 野蒜/野葱：有明显蒜/葱味，叶和鳞茎均可食
  - 蕨菜：嫩芽可食，必须充分煮沸至少15分钟并弃去煮水以减少原蕨苷（无法完全去除）
  - 荠菜：叶子可食，可煮汤或做馅
  - 通用安全法则：不确定的植物绝对不要吃
  prerequisites:
  - 植物识别能力
  warnings:
  - 蕨菜必须充分煮沸去毒
  - 有白色乳汁的植物多数有毒
  - 蘑菇：除非100%确定，否则绝对不要食用
  - 城市区域的植物可能受化学污染
  - 首次食用任何新植物只吃少量，等6-8小时观察反应
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/food/plants/universal_test
  category: survival
  subcategory: food
  priority: 0
  title: 植物可食性通用测试法
  summary: 在无法确认植物是否可食用时，使用此分步测试法。整个过程约需24小时，但可以救命。
  steps:
  - 第一步：将植物分开——叶、茎、根、花、果分别测试
  - 第二步：闻气味——强烈或刺鼻气味通常表示有毒
  - 第三步：皮肤测试——将植物汁液涂在手腕内侧，等15分钟
  - 第四步：嘴唇测试——将植物放在嘴唇上，等3分钟，有灼烧感则有毒
  - 第五步：舌头测试——放在舌头上15分钟，有刺痛感则吐出
  - 第六步：咀嚼测试——咀嚼后含在口中15分钟，无不适则吞下少量
  - 第七步：等待8小时——无恶心、呕吐、腹泻则该部位可食用
  - 第八步：用同样方法测试植物其他部位
  prerequisites:
  - 耐心和时间
  - 仅限紧急情况使用
  warnings:
  - 此测试不适用于蘑菇！蘑菇测试不可靠
  - 测试期间不要吃其他任何东西
  - 如出现任何不适立即停止并催吐
  - 儿童和病人不要食用未确认的植物
  - 此测试并非100%可靠，某些致命毒素（如毒芹碱、乌头碱）有延迟发作，仅作为最后手段
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/food/hunting/traps
  category: survival
  subcategory: food
  priority: 0
  title: 简易陷阱制作
  summary: 在野外，陷阱比主动狩猎效率更高。最基础的是落坑陷阱和绳套陷阱。
  steps:
  - 绳套陷阱（最简单）：
  - '  1. 用细钢丝或绳索做一个滑动绳圈'
  - '  2. 绳圈直径约10-15cm（小动物）'
  - '  3. 沿动物通道设置，固定在树桩上'
  - '  4. 绳圈底部离地面约5-10cm'
  - 落坑陷阱：
  - '  1. 在动物通道上挖深约30cm的坑'
  - '  2. 坑底放尖刺（削尖的木棍）'
  - '  3. 用细枝和叶子覆盖坑口'
  - '  4. 在覆盖物上放少量诱饵'
  prerequisites:
  - 钢丝/绳索
  - 刀具
  - 耐心
  warnings:
  - 定期检查陷阱，避免猎物被其他捕食者抢走
  - 陷阱可能伤人，做好标记
  - 食用野生动物必须彻底煮熟
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/food/fishing/basic
  category: survival
  subcategory: food
  priority: 0
  title: 基础捕鱼方法
  summary: 在有水域的地方，捕鱼比狩猎更可靠。无渔具时也有多种方法可用。
  steps:
  - 手线钓鱼：绳索+弯钩（别针/骨针）+蠕虫/昆虫做饵
  - 叉鱼：削尖长木棍，在浅水处等待鱼经过后快速刺下
  - 圈鱼：在浅水区用石头围成半圆形鱼堰，鱼退潮时被困
  - 夜钓：鱼在夜间更活跃，用火把或头灯吸引鱼
  - 鱼笼：用枝条编成笼子，入口设倒刺，放饵后放在水中
  prerequisites:
  - 靠近水域
  warnings:
  - 所有淡水鱼必须彻底煮熟以杀灭寄生虫
  - 避免食用颜色异常或畸形鱼
  - 某些热带鱼种有河豚毒素，确认安全后再食用
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/food/preservation/drying
  category: survival
  subcategory: food
  priority: 0
  title: 食物干燥保存法
  summary: 干燥是最古老的食物保存方法。去除水分后微生物无法生长，肉类和水果均可干燥保存。
  steps:
  - 肉类干燥（肉干）：
  - '  1. 将瘦肉切成薄条（约0.5cm厚）'
  - '  2. 切掉所有脂肪（脂肪容易变质）'
  - '  3. 在火上熏烤至完全干燥（弯曲不断裂）'
  - '  4. 存放在干燥通风处'
  - 水果干燥：
  - '  1. 切成薄片'
  - '  2. 在阳光下晾晒或火上烘干'
  - '  3. 完全干燥后存入密封容器'
  prerequisites:
  - 刀具
  - 干燥环境或热源
  warnings:
  - 肉干必须完全干燥，否则会发霉
  - 雨天不要在户外晾晒
  - 干燥保存的食物食用前最好重新加热
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/shelter/natural/lean_to
  category: survival
  subcategory: shelter
  priority: 0
  title: 单坡庇护所（Lean-to）
  summary: 最简单实用的庇护所。利用一根横木和多根斜木搭建，覆盖树叶/草/土即可防风挡雨。
  steps:
  - 选址：干燥、平坦、远离河道和悬崖边
  - 找两棵间距约2米的树（或立两根柱子）
  - 在两树间绑一根横木，高度约1米
  - 将长木棍斜靠在横木上，间距约20cm
  - 在斜木上从下到上铺盖层：枝叶→树叶→草→更多枝叶
  - 底层铺干草或树叶做床铺（隔潮保暖）
  - 在入口对面设置反射墙火堆取暖
  prerequisites:
  - 树木/木棍
  - 绳索/藤蔓
  - 大量树叶和草
  warnings:
  - 入口背对风向
  - 不要在枯树下搭建（树枝可能掉落）
  - 庇护所不宜过大，小空间更易保暖
  - 地面一定要铺隔离层，防止体温流失
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/shelter/natural/debris_hut
  category: survival
  subcategory: shelter
  priority: 0
  title: 落叶庇护所（Debris Hut）
  summary: 利用大量落叶和树枝搭建的保温庇护所，不需要绳索，保暖性极好，适合寒冷环境。
  steps:
  - 找一根长约2米的坚固木杆做主梁
  - 一端架在树桩/石头上（约1米高），另一端放在地面
  - 两侧斜放木棍形成A字形骨架
  - 在骨架上堆放大量落叶/草/苔藓（至少30cm厚）
  - 在最外层放更多树枝防止落叶被风吹走
  - 内部用落叶铺成厚床铺
  - 用一捆落叶做可移动的门
  prerequisites:
  - 大量落叶
  - 木棍
  - 时间
  warnings:
  - 落叶厚度是关键，太薄无法保温；寒冷环境应加厚至60cm以上
  - 定期补充被风吹散的落叶
  - 注意通风，不要完全密封
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/shelter/urban/ruins
  category: survival
  subcategory: shelter
  priority: 0
  title: 城市废墟庇护所
  summary: 在核危机或社会崩溃后的城市废墟中，利用现有建筑是最快的庇护方式。需注意结构安全和污染。
  steps:
  - 选址原则：选择结构完整的建筑，远离危墙和高层
  - 优先选择地下室/一楼（更稳定、保温更好）
  - 检查结构：墙壁无大裂缝、楼板无塌陷迹象、无倾斜
  - 清理空间：移除碎玻璃、裸露电线、积水
  - 封堵入口：用可用材料封堵不用的门窗，只留一个出入口
  - 保暖：用废布/纸/纸板铺地隔潮，小空间比大空间易保暖
  - 通风：确保至少一个通风口，特别是生火时
  prerequisites:
  - 城市/城镇废墟环境
  warnings:
  - 结构不稳的建筑随时可能二次坍塌
  - 核危机后注意辐射——地下室更安全
  - 废墟中可能有残留化学品，戴手套操作
  - 不要使用电梯，不要在有燃气味的地方生火
  - 密闭或通风不良空间生火会产生一氧化碳，即使无燃气味也可能致命，必须保证通风
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/medical/bleeding
  category: survival
  subcategory: medical
  priority: 0
  title: 出血止血法
  summary: 严重出血是最紧急的威胁之一。直接压迫是最有效的止血方法，必须在出血后立即实施。
  steps:
  - 评估出血严重程度：动脉血（喷射/鲜红）最危险，静脉血（涌出/暗红）次之
  - 直接压迫：用干净布/衣物直接压在伤口上，用力按压
  - 保持压迫至少10分钟，不要反复揭开查看
  - 如果布被血浸透，在上面加更多布，不要移除第一层
  - 抬高伤肢（高于心脏位置）辅助止血
  - 如压迫无效，在上臂/大腿上使用止血带：
  - '  - 在伤口上方5-10cm处绑紧'
  - '  - 在患者额头或止血带上记录使用时间'
  - '  - 在专业医疗到达前不要松开（松开会导致再出血和再灌注损伤）'
  prerequisites:
  - 干净布/衣物
  - 绳索/带子（止血带用）
  warnings:
  - 止血带是最后手段，会损伤组织
  - 必须记录止血带使用时间，超时可能导致截肢
  - 不要用铁丝/细绳做止血带（会切伤组织）
  - 内出血（腹部肿胀、呕血）无法在野外处理，需立即寻找医疗
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/medical/cpr
  category: survival
  subcategory: medical
  priority: 0
  title: 心肺复苏术（CPR）
  summary: 当人无意识且无呼吸时，立即进行CPR。胸外按压+人工呼吸可维持血液循环。
  steps:
  - 确认安全：确保自己和伤者处于安全位置
  - 判断意识：大声呼叫并轻拍肩膀
  - 判断呼吸：观察胸部是否起伏，持续5-10秒
  - 如无呼吸，立即开始胸外按压：
  - '  - 双手重叠放在胸骨下半部（两乳头连线中点）'
  - '  - 用力下压5-6cm，频率每分钟100-120次'
  - '  - 每次按压后让胸廓完全回弹'
  - 每30次按压后进行2次人工呼吸：
  - '  - 仰头抬颏开放气道'
  - '  - 捏住鼻子，嘴包嘴吹气1秒'
  - '  - 观察胸廓是否抬起'
  - 持续进行直到：伤者恢复呼吸/救援到达/你精疲力竭
  prerequisites:
  - 无（仅凭双手）
  warnings:
  - 不要对有呼吸的人做CPR
  - 按压位置过低会折断肋骨或损伤肝脏
  - 如只有你一人，以胸外按压为主（免人工呼吸也可）
  - 不要因为害怕做错而犹豫，做不完美的CPR也比不做强
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/medical/wound_care
  category: survival
  subcategory: medical
  priority: 0
  title: 伤口处理基础
  summary: 所有伤口都有感染风险。正确清洗和包扎是野外伤口处理的关键。
  steps:
  - 止血：用干净布直接压迫（参见止血法）
  - 清洗伤口：用大量清洁水冲洗（煮沸冷却的水最佳）
  - 清除异物：小心取出可见的碎片/泥土
  - 消毒：用酒精/碘酒擦拭伤口周围皮肤（不要直接倒入伤口）
  - 包扎：用干净布覆盖伤口，松紧适度地包扎
  - 每日检查：观察红肿、发热、化脓等感染迹象
  - 换药：每天更换敷料，保持伤口清洁干燥
  prerequisites:
  - 清洁水
  - 干净布/绷带
  - 消毒剂（如有）
  warnings:
  - 深伤口不要自行缝合
  - 动物咬伤必须彻底清洗，感染风险极高
  - 如出现红线从伤口向心脏方向延伸（淋巴管炎），这是严重感染征兆
  - 破伤风：锈钉/土壤污染的伤口需考虑破伤风风险
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/medical/hypothermia
  category: survival
  subcategory: medical
  priority: 0
  title: 失温症处理
  summary: 体温低于35°C即为失温。在野外，失温是最常见的致命因素之一，必须早发现早处理。
  steps:
  - 识别症状：
  - '  - 轻度：颤抖、皮肤苍白、意识模糊'
  - '  - 中度：颤抖停止、行动迟缓、说话困难'
  - '  - 重度：意识丧失、心率极慢、看似死亡'
  - 处理方法：
  - '  - 脱离寒冷环境，进入庇护所'
  - '  - 脱掉湿衣服，换上干衣或裹上干燥毯子'
  - '  - 轻度：喝热饮、吃高热量食物、活动身体'
  - '  - 中/重度：不要让患者剧烈运动'
  - '  - 用体温传递热量：健康人紧贴患者'
  - '  - 逐渐复温，不要快速加热（如热水浴）'
  prerequisites:
  - 干燥衣物/毯子
  - 庇护所
  - 热源
  warnings:
  - 严重失温者不要搓揉四肢（会将冷血送回核心，可能致命）
  - 不要给失去意识的人喂水或饮酒
  - 失温者可能看起来死了但仍有微弱生命迹象，不要放弃
  - 复温过快可能导致心律失常
  verification: field_tested
  source: pre_collapse
  language: zh
- id: survival/medical/fracture
  category: survival
  subcategory: medical
  priority: 0
  title: 骨折临时处理
  summary: 野外骨折无法进行专业治疗，但正确固定可减轻疼痛、防止进一步损伤，为后续治疗争取时间。
  steps:
  - 判断骨折：剧烈疼痛、肿胀、变形、无法活动、骨擦音
  - 不要试图复位
  - 固定：
  - '  - 找到足够长的木棍/树枝做夹板'
  - '  - 夹板应超过骨折处上下各一个关节'
  - '  - 用布条/绳索将夹板固定在肢体上'
  - '  - 固定前在夹板和皮肤间垫软物'
  - '  - 检查末梢循环：手指/脚趾能否活动、有无知觉'
  - 开放性骨折（骨头刺出皮肤）：
  - '  - 不要把骨头推回去'
  - '  - 用干净布覆盖伤口'
  - '  - 固定后尽快寻求医疗'
  prerequisites:
  - 木棍/夹板
  - 布条/绳索
  - 软垫材料
  warnings:
  - 固定后如手指/脚趾变紫/麻木，松开重新固定（过紧）
  - 开放性骨折感染风险极高
  - 骨盆/脊柱骨折不要随意移动患者
  verification: field_tested
  source: pre_collapse
  language: zh
