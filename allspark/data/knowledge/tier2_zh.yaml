- id: agriculture/composting/system
  category: agriculture
  subcategory: composting
  priority: 2
  title: 堆肥系统建设
  summary: 持续农业需要持续补充土壤养分。堆肥将有机废物转化为优质肥料，是自给农业的基石。
  steps:
  - 选择阴凉通风处，搭建1m×1m×1m的堆肥箱（木条/竹竿/砖）
  - 分层堆放：棕色层（干叶/稻草/纸）→绿色层（菜叶/草/粪便）→薄土层
  - 棕色:绿色比例约3:1，保持湿润但不积水
  - 每1-2周翻堆一次，引入空气加速分解
  - 堆内温度应达到55-65°C（手插入感觉烫，数秒内必须抽出，最好用温度计）
  - 2-6个月完成，成品为深褐色松散泥土状
  prerequisites:
  - 有机废物
  - 堆肥空间
  - 翻堆工具
  warnings:
  - 不要放入肉类、油脂、病株——会招虫和传播病害
  - 堆肥温度不足55°C无法杀灭病原体和杂草种子
  - 猫狗粪便可能含寄生虫，不建议使用
  verification: expert_verified
  source: pre_collapse
  language: zh
- id: agriculture/seed_saving/techniques
  category: agriculture
  subcategory: seed_saving
  priority: 2
  title: 种子保存技术
  summary: 种子是农业的命脉。掌握种子保存技术可以持续种植，不必依赖外部种子供应。
  steps:
  - 选择最健壮的植株留种，标记不要误采
  - 等果实完全成熟再采收种子
  - 湿种子（番茄/黄瓜）：带果汁室温发酵2-4天至凝胶溶解，再洗净晾干
  - 干种子（豆类/谷物）：连荚/穗晾干后脱粒
  - 干燥处理：阴凉通风处晾7-14天至含水量8%以下
  - 储存：纸袋或密封罐，加入干燥剂，存于阴凉干燥处
  - 标注品种、日期、来源
  prerequisites:
  - 成熟作物
  - 干燥空间
  - 储存容器
  warnings:
  - 杂交种子（F1）后代性状分离，优先保存自交品种
  - 种子含水量过高会导致霉变
  - 不同品种的十字花科植物会互相杂交，需隔离种植
  verification: expert_verified
  source: pre_collapse
  language: zh
- id: chemistry/paper/making
  category: chemistry
  subcategory: paper
  priority: 2
  title: 手工造纸
  summary: 纸张是记录和传播知识的基础。用植物纤维制作纸张，延续文明的记忆。
  steps:
  - 收集纤维原料：旧纸/稻草/麻/树皮（构树皮最佳）
  - 将原料浸泡1-2天软化
  - 用碱液（草木灰水）煮沸2-4小时分解木质素
  - 充分水洗去除碱液
  - 用锤/石臼捣碎成纸浆
  - 纸浆加水稀释，加入粘合剂（黄蜀葵/淀粉糊）
  - 用抄纸框（木框+细网）抄纸——水平浸入再提起
  - 覆在平板上压水、晾干
  prerequisites:
  - 植物纤维
  - 草木灰
  - 抄纸框
  - 大量水
  warnings:
  - 碱液煮沸时注意通风和防护
  - 禁用铝锅（碱液腐蚀铝并污染纸浆），使用铁/不锈钢/搪瓷器皿；碱液腐蚀皮肤，接触立即冲洗
  - 纸浆浓度影响纸张厚度——稀则薄、浓则厚
  - 干燥时避免阳光直射，防止纸张翘曲
  verification: expert_verified
  source: pre_collapse
  language: zh
- id: chemistry/dye/natural
  category: chemistry
  subcategory: dye
  priority: 2
  title: 天然染料提取
  summary: 天然染料用于染色和标记。不同植物可提取不同颜色：蓝靛（蓝色）、茜草（红色）、黄柏（黄色）。
  steps:
  - 蓝色：蓝草（板蓝根/蓼蓝）叶浸泡发酵，加碱液制靛蓝；须将不溶性靛蓝还原为可溶性隐色体（传统用石灰+还原剂/发酵法），浸染后空气中氧化显蓝；靛蓝不走媒染流程
  - 红色：茜草根切碎，热水浸泡提取茜素
  - 黄色：黄柏皮/石榴皮/洋葱皮热水煮提取
  - 黑色：五倍子（虫瘿）加铁媒染剂
  - 媒染剂：明矾（铝媒）、铁锈水（铁媒）、草木灰（碱媒）
  - 染色流程：媒染→水洗→浸染→水洗→晾干
  prerequisites:
  - 染料植物
  - 媒染剂
  - 水
  - 容器
  warnings:
  - 某些染料植物有毒，操作后洗手
  - 铁媒染剂会使颜色变暗，注意用量
  - 天然染色色牢度不如化学染料，需要多次浸染加深
  verification: expert_verified
  source: pre_collapse
  language: zh
- id: mechanical/watermill/simple
  category: mechanical
  subcategory: watermill
  priority: 2
  title: 简易水力磨坊
  summary: 利用水流动力研磨谷物、锯木。水力是可持续的机械动力来源。
  steps:
  - 选址：水流稳定、落差0.5-2m的溪流
  - 制作水轮：用木板制作直径1-2m的轮子，边缘装水斗
  - 选型：0.5m低落差用下射式（水流冲击底部水斗），1.5m以上才用上射式（顶进水）
  - 安装水轮：水平轴安装，水斗朝向水流方向
  - 连接磨石：水轮轴通过齿轮连接上磨石
  - 调整水流：用导流槽将水引向水轮顶部
  - 维护：定期检查轴承润滑和木件腐朽
  prerequisites:
  - 溪流
  - 木材
  - 石磨
  - 基本木工技能
  warnings:
  - 洪水可能冲毁水轮，雨季注意加固
  - 木制轴承需要经常润滑（动物油脂/石墨）
  - 磨石碎裂有飞出危险，周围设防护
  verification: expert_verified
  source: pre_collapse
  language: zh
- id: mechanical/bicycle_generator
  category: mechanical
  subcategory: generator
  priority: 2
  title: 自行车发电装置
  summary: 用废旧自行车和发电机改装成人力发电装置，可为小电器充电和照明。
  steps:
  - 获取废旧自行车和直流发电机/汽车发电机
  - 将发电机固定在自行车后轮旁
  - 用皮带或摩擦轮连接后轮和发电机
  - 连接整流器和稳压电路（12V系统）
  - 接蓄电池储存电能（铅酸电池最易获取）
  - 骑行发电：中等速度可输出50-100W功率
  prerequisites:
  - 自行车
  - 发电机
  - 整流器
  - 蓄电池
  - 基本电路知识
  warnings:
  - 发电机电压不稳定，必须接稳压器后再接设备
  - 铅酸电池充电时产生氢气，保持通风远离明火
  - 长时间骑行发电非常消耗体力，不适合体弱者
  verification: expert_verified
  source: pre_collapse
  language: zh
- id: weather/shelter/climate_design
  category: weather
  subcategory: shelter
  priority: 2
  title: 气候适应性庇护所设计
  summary: 长期定居需要根据当地气候设计庇护所。不同气候需要不同的保温、通风、防水策略。
  steps:
  - 寒冷地区：厚墙（土/石/草泥）、小窗朝南、双层屋顶保温、地暖烟道
  - 炎热潮湿：高脚屋防潮、大屋檐遮阳、交叉通风、竹/木结构
  - 炎热干燥：厚土墙蓄热、小窗减少热辐射、内院式布局、地下储藏室
  - 多雨地区：陡坡屋顶、深屋檐、防潮层、排水沟渠
  - 台风地区：低矮结构、加固绑扎、背风选址
  prerequisites:
  - 当地气候数据
  - 建筑材料
  - 工具
  warnings:
  - 选址避开洪水线、滑坡体和风口
  - 烟道/壁炉必须正确排烟——一氧化碳无声致命
  - 土坯建筑在地震带需要加固（竹筋/木框架）
  verification: expert_verified
  source: pre_collapse
  language: zh
- id: energy/wind/basic_turbine
  category: energy
  subcategory: wind
  priority: 2
  title: 简易风力发电
  summary: 风力是可持续能源。用简单材料制作小型风力发电机，为照明和通讯供电。
  steps:
  - 选址：开阔高地，年平均风速4m/s以上
  - 制作叶片：PVC管剖开/木板/金属板，3叶片设计
  - 制作轮毂：金属圆盘固定叶片，中心连接发电机轴
  - 发电机：永磁直流电机（废旧汽车/自行车电机）
  - 塔架：4-6米高钢管/木杆，用拉索固定
  - 电气：整流器→稳压器→蓄电池→逆变器（如需交流）
  - 维护：定期检查叶片、轴承和电气连接
  prerequisites:
  - 发电机
  - 叶片材料
  - 塔架
  - 整流稳压电路
  warnings:
  - 风力发电机塔架必须牢固固定——倒塌致命
  - 雷暴时断开电气连接防止雷击
  - 旋转叶片有切割危险，设置安全距离
  - 风速超过设计极限时必须刹车或放倒叶片
  - PVC叶片冬季脆化、老化需更换；塔基2倍塔高半径内为抛射危险区
  verification: expert_verified
  source: pre_collapse
  language: zh
- id: energy/biogas/digester
  category: energy
  subcategory: biogas
  priority: 2
  title: 沼气池建设
  summary: 沼气是有机废物厌氧发酵产生的可燃气体。同时产出沼液沼渣作为优质肥料，一举两得。
  steps:
  - 选址：靠近畜舍/厕所，地下水位低处
  - 建池：砖/石砌6-10m³圆筒形池，分进料间、发酵间、储气间
  - 密封：内壁用水泥砂浆抹面3遍，确保不漏气不漏水
  - 投料：人畜粪便+秸秆碎+水，干物质浓度8-10%
  - 启动：加入老沼液或牛粪作为菌种，密封发酵
  - 产气：7-15天开始产气，火焰呈蓝色为合格
  - 温度：中温发酵最适25-38°C（理想35°C），低于15°C基本停摆
  - 日常：每天加料，定期出渣，保持pH 6.8-7.5
  prerequisites:
  - 建池材料（砖/水泥）
  - 有机废物
  - 劳动力
  warnings:
  - 沼气含甲烷和硫化氢，有窒息和爆炸风险
  - 严禁在沼气池旁吸烟或使用明火
  - 下池检修必须先通风，多人监护——沼气池内缺氧致命
  - 冬季低温产气量下降，需保温措施
  - 储气间压力由水压间自动调节，严禁密封死腔；输出端应装阻火器防回火
  verification: expert_verified
  source: pre_collapse
  language: zh
- id: medicine/herbal/common
  category: medicine
  subcategory: herbal
  priority: 2
  title: 常见草药识别与应用
  summary: 药物短缺时，常见草药可处理基础病症。但必须准确识别，误用可能致命。
  steps:
  - 退烧：柴胡（根煮水）、薄荷（叶泡茶）
  - 止血：三七（粉末外敷）、白及（粉末撒伤口）
  - 消炎：金银花（花泡水）、蒲公英（全草煮水）
  - 止泻：石榴皮（煮水）、车前草（叶煮水）
  - 驱虫：艾草（烟熏/泡水）、大蒜（生食）
  - 镇痛：延胡索（根煮水）、川芎（根煮水）
  - 剂量：成人一日干品3-9g煎服；煎药勿用铁锅（鞣质反应）；三七/白及粉仅表浅外敷，深部伤口勿灌入
  prerequisites:
  - 草药识别能力
  - 参考图鉴
  warnings:
  - 绝对不要使用无法100%确认的植物——误食毒草可致命
  - 草药剂量难以精确控制，从小剂量开始
  - 孕妇、儿童、体弱者慎用草药
  - 草药不能替代专业医疗，仅作应急使用
  verification: expert_verified
  source: pre_collapse
  language: zh
