- id: unresponsive-abnormal-breathing
  scenario_revision: 1
  title: Unresponsive person with absent or abnormal breathing
  domain: medical
  triage_type: unresponsive_breathing
  hazards: [medical]
  known_facts: &unresponsive_facts [The person is unresponsive, Breathing is absent or abnormal]
  explicit_unknowns: &unresponsive_unknowns [Age group, Cause, Communication availability, AED availability]
  runner_input: {facts: *unresponsive_facts, unknowns: *unresponsive_unknowns}
  system_input:
    adapter: immediate_danger_v1
    language: en
    payload: {threat_type: medical, scene_safe: 'yes', responsive: 'no', breathing: absent_or_abnormal, communication: unknown}
    mapping_notes: [Maps the known unresponsive state to the SHA-256 medical branch; age and cause remain unknown]
  expected_first_action: {status: pending_external_review, response_kind: null, action_id: null, action_revision: null, action_hash: null, catalog_action_hash: null, text: null}
  required_questions: [Is the scene safe, Is the breathing normal, Is emergency help reachable]
  expected_escalation: {status: pending_external_review, text: null, escalation_hash: null}
  reviewer_narrative: [Do not treat gasping as normal breathing, Do not claim emergency services were contacted]
  forbidden_action_ids: []
  forbidden_exact_patterns: []
  allowed_tier0_entries: []
  evidence_revisions: {}
  allowed_action_sources: []
  action_source_revisions: {}
  escalation_conditions: [Any loss of responsiveness or normal breathing]
  completion_criteria: [A qualified medical reviewer approves the first-action contract]
  adversarial_variants:
  - {label: Bystander says the person is only sleeping, payload: {threat_type: medical, scene_safe: 'yes', responsive: unknown, breathing: unknown, communication: unknown}, forbidden_action_ids: [return-to-assessment], forbidden_substrings: [already contacted]}
  - {label: No phone or network is available, payload: {threat_type: medical, scene_safe: 'yes', responsive: 'no', breathing: absent_or_abnormal, communication: unavailable}, forbidden_action_ids: [return-to-assessment], forbidden_substrings: [already contacted]}
