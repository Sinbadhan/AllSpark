sources:
  red-cross-first-aid-steps:
    organization: American Red Cross
    title: First Aid Steps
    locator: "First Aid Steps: check the scene for safety; check responsiveness, breathing, and life-threatening bleeding; get emergency help when indicated"
    locator_key: immediate_danger_source_red_cross_steps_locator
    url: https://www.redcross.org/take-a-class/first-aid/performing-first-aid/first-aid-steps
    revision: accessed-2026-07-16
    retrieved_at: '2026-07-16'
    assertion: Check scene safety before care and assess responsiveness, breathing, and life-threatening bleeding before choosing the next response.
    captured_assertion: The captured source record requires scene safety, responsiveness, breathing, life-threatening bleeding assessment, and emergency help when indicated.
    content_hash: sha256:ac8b0439051d08fb0a72cfd9f9153f66c3ce08407d15d4f886420a02ce1d662d
  red-cross-life-threatening-bleeding:
    organization: American Red Cross
    title: Life-Threatening External Bleeding
    locator: "Life-threatening external bleeding: scene safety and direct pressure; packing or tourniquet only when applicable and within training boundaries"
    locator_key: immediate_danger_source_red_cross_bleeding_locator
    url: https://www.redcross.org/take-a-class/resources/learn-first-aid/bleeding-life-threatening-external
    revision: accessed-2026-07-16
    retrieved_at: '2026-07-16'
    assertion: After confirming scene safety, direct pressure is the initial response for life-threatening external bleeding; packing and tourniquets have applicability and training boundaries.
    captured_assertion: The captured source record places direct pressure after scene safety and keeps packing and tourniquets within explicit applicability and training boundaries.
    content_hash: sha256:90bbc24e6d5602b9c28090fe4b382bd6adcf0e4e8965529268e3c889237a9719
  cdc-niosh-carbon-monoxide:
    organization: CDC/NIOSH
    title: Carbon Monoxide
    locator: "Carbon monoxide exposure response: move immediately to fresh air and seek medical attention; do not infer that re-entry is safe"
    locator_key: immediate_danger_source_cdc_co_locator
    url: https://www.cdc.gov/niosh/carbon-monoxide/about/index.html
    revision: accessed-2026-07-16
    retrieved_at: '2026-07-16'
    assertion: Suspected carbon monoxide exposure requires moving to fresh air immediately and seeking medical attention without implying that re-entry is safe.
    captured_assertion: The captured source record directs exposed people to fresh air and medical attention without declaring the contaminated area safe for re-entry.
    content_hash: sha256:210bcf422f7005c06ac058490c4db139e2453c472ee1faa1947b11f90e7bf397
  nhs-first-aid:
    organization: NHS
    title: First aid
    locator: "CPR and emergency branches: normal breathing, ineffective cough/choking, age, awareness, and cause affect the response"
    locator_key: immediate_danger_source_nhs_first_aid_locator
    url: https://www.nhs.uk/tests-and-treatments/first-aid/
    revision: accessed-2026-07-16
    retrieved_at: '2026-07-16'
    assertion: Breathing, responsiveness, age, and cause affect emergency first-aid branches and must not be collapsed into one universal instruction.
    captured_assertion: The captured source record distinguishes emergency branches by breathing, responsiveness, age, and cause instead of prescribing one universal action.
    content_hash: sha256:49539bc79b7faeb4207742dda58382093ebaba1ad89533f790256c2112fb627b
  cdc-heat-illness:
    organization: CDC/NIOSH
    title: Heat-related illnesses
    locator: "Heat stroke and heat exhaustion: rapid cooling, symptom boundaries, and emergency escalation"
    locator_key: immediate_danger_source_cdc_heat_locator
    url: https://www.cdc.gov/niosh/heat-stress/about/illnesses.html
    revision: accessed-2026-07-19
    retrieved_at: '2026-07-19'
    assertion: Move an affected person to a cooler place and begin cooling; altered mental status, seizure, or unconsciousness requires emergency response.
    captured_assertion: The captured source record distinguishes heat exhaustion from heat stroke and prioritizes rapid cooling with emergency escalation for neurological symptoms.
    content_hash: sha256:7e40b2cd63ad3169a498017a574ded0438076229678b437012d771310cd1f596
  cdc-hypothermia:
    organization: CDC
    title: Preventing hypothermia
    locator: "Hypothermia warning signs and gradual core warming without direct high heat"
    locator_key: immediate_danger_source_cdc_cold_locator
    url: https://www.cdc.gov/winter-weather/prevention/index.html
    revision: accessed-2026-07-19
    retrieved_at: '2026-07-19'
    assertion: Move the person to shelter, remove wet clothing, and warm the center of the body gradually while seeking medical help for concerning symptoms.
    captured_assertion: The captured source record prioritizes dry shelter and gradual core warming while avoiding direct high heat on a person with suspected hypothermia.
    content_hash: sha256:adad423285c807de9817a516dd8a2a2d45bb241ad73cab1af90226fe34ea363c
  hrsa-poison-help:
    organization: U.S. Health Resources and Services Administration
    title: Poison Help
    locator: "Poison exposure first response: stop exposure safely, do not induce vomiting, preserve product information, and contact poison help"
    locator_key: immediate_danger_source_poison_help_locator
    url: https://poisonhelp.hrsa.gov/what-you-can-do
    revision: accessed-2026-07-19
    retrieved_at: '2026-07-19'
    assertion: Do not induce vomiting; stop exposure without creating another casualty, keep identifying information, and contact poison or emergency help.
    captured_assertion: The captured source record rejects induced vomiting and directs callers to preserve substance information and obtain poison-specific professional guidance.
    content_hash: sha256:ed4d96a56955ac5ca97c171d0ec2dbc3987c5742cd15c484d33bf76ba86211e8
