sources:
  red-cross-first-aid-steps:
    organization: American Red Cross
    title: First Aid Steps
    locator: "First Aid Steps: check the scene for safety; check responsiveness, breathing, and life-threatening bleeding; get emergency help when indicated"
    locator_key: immediate_danger_source_red_cross_steps_locator
    url: https://www.redcross.org/take-a-class/first-aid/performing-first-aid/first-aid-steps
    revision: accessed-2026-07-16
    assertion: Check scene safety before care and assess responsiveness, breathing, and life-threatening bleeding before choosing the next response.
    content_hash: sha256:089c69084b8e68b06e7adadb271bab3ff51130b8a68bb24b823357f8d8b10381
  red-cross-life-threatening-bleeding:
    organization: American Red Cross
    title: Life-Threatening External Bleeding
    locator: "Life-threatening external bleeding: scene safety and direct pressure; packing or tourniquet only when applicable and within training boundaries"
    locator_key: immediate_danger_source_red_cross_bleeding_locator
    url: https://www.redcross.org/take-a-class/resources/learn-first-aid/bleeding-life-threatening-external
    revision: accessed-2026-07-16
    assertion: After confirming scene safety, direct pressure is the initial response for life-threatening external bleeding; packing and tourniquets have applicability and training boundaries.
    content_hash: sha256:63d78a85067fa86f702a84aec6bb509699fcfb9de80f8c5d56eadc6c626090af
  cdc-niosh-carbon-monoxide:
    organization: CDC/NIOSH
    title: Carbon Monoxide
    locator: "Carbon monoxide exposure response: move immediately to fresh air and seek medical attention; do not infer that re-entry is safe"
    locator_key: immediate_danger_source_cdc_co_locator
    url: https://www.cdc.gov/niosh/carbon-monoxide/about/index.html
    revision: accessed-2026-07-16
    assertion: Suspected carbon monoxide exposure requires moving to fresh air immediately and seeking medical attention without implying that re-entry is safe.
    content_hash: sha256:0989fce2e7b6834f2dcb5757a59dc8275b06de9bf689ee3d3ea647a06da69756
  nhs-first-aid:
    organization: NHS
    title: First aid
    locator: "CPR and emergency branches: normal breathing, ineffective cough/choking, age, awareness, and cause affect the response"
    locator_key: immediate_danger_source_nhs_first_aid_locator
    url: https://www.nhs.uk/tests-and-treatments/first-aid/
    revision: accessed-2026-07-16
    assertion: Breathing, responsiveness, age, and cause affect emergency first-aid branches and must not be collapsed into one universal instruction.
    content_hash: sha256:1eb9e62cadc22d8a46e667ecbf8c1d04e5b867391a039ac8c964a9664b386fb8
