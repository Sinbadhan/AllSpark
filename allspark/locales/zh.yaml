weather_cloud_guide: "☁️ 云图指南（目测参考）：\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n  ☀️ 晴空无云 / 少量卷云\
  \ → 持续晴好\n  \U0001F324️ 积云（棉花状）→ 白天晴，傍晚可能阵雨\n  ☁️ 层云（灰色薄层）→ 阴天，可能细雨\n  \U0001F325\
  ️ 高积云（鱼鳞状）→ 天气转变信号\n  ⛈️ 积雨云（高耸黑色）→ 暴风雨即将来临！\n  \U0001F32B️ 层积云（低矮灰白）→ 毛毛雨或雾\n\n\
  口诀：云变黑、云变低、风变大 → 赶紧避！"
