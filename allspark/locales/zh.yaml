immediate_danger_escalation_medical_assessment: 寻求受过训练的医疗帮助；如可通信且情况紧急，请联系当地紧急服务。火种不会声称已经联系。
immediate_danger_escalation_uncertain: 寻求当地受过训练的帮助；如可通信且危险紧急，请联系当地紧急服务。火种不会声称已经联系。
