weather_fair_stable: 高压但趋于稳定，天气尚可，可安排室外活动。
weather_improving: 气压正常且上升，天气趋于好转。
weather_stable: 气压稳定，天气将维持当前状况。
weather_deteriorating: 气压正常但下降，天气可能转差。注意准备防雨措施。
weather_rain_likely: 气压较低且下降，近期可能降雨。建议：收集雨水、加固庇护所防水、减少外出。
weather_unsettled: 气压偏低，天气不稳定。随时准备应对变化。
weather_storm_likely: 🚨 气压极低，暴风雨概率高！建议：立即加固庇护所、储存物资、避免外出。
weather_humidity_rain: 高湿度+气压下降，降雨概率进一步提升。
weather_cold_warning: 注意：低温天气，做好防寒保暖。
weather_cloud_guide: "☁️ 云图指南（目测参考）：\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n  ☀️ 晴空无云 / 少量卷云\
  \ → 持续晴好\n  \U0001F324️ 积云（棉花状）→ 白天晴，傍晚可能阵雨\n  ☁️ 层云（灰色薄层）→ 阴天，可能细雨\n  \U0001F325\
  ️ 高积云（鱼鳞状）→ 天气转变信号\n  ⛈️ 积雨云（高耸黑色）→ 暴风雨即将来临！\n  \U0001F32B️ 层积云（低矮灰白）→ 毛毛雨或雾\n\n\
  口诀：云变黑、云变低、风变大 → 赶紧避！"
