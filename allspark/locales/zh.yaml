immediate_danger_applicable_scene_unsafe: 现场不安全，或无法确认现场安全。
immediate_danger_applicable_fire_safe: 疑似火灾、烟雾或一氧化碳，且用户报告当前现场可以安全采取动作。
immediate_danger_applicable_bleeding_safe: 存在危及生命的外部出血，且可以安全接近现场。
immediate_danger_applicable_unresponsive: 当事人无反应，或无法确认其是否有反应。
immediate_danger_applicable_medical_responsive: 存在医疗紧急情况，且当事人有反应。
immediate_danger_applicable_unresponsive_breathing_not_abnormal: 当事人无反应或反应不明，但呼吸正常或呼吸状态不明。
immediate_danger_applicable_uncertain_safe: 存在其他或未识别危险，但当前所在位置未被确认不安全。
immediate_danger_applicable_none: 未识别到立即危险。
immediate_danger_contra_no_reentry: 不要为执行此动作进入或重新进入危险现场。
immediate_danger_contra_no_contaminated_reentry: 不要依据本指引重新进入受污染或燃烧区域。
immediate_danger_contra_no_pressure_delay: 不要为了寻找设备而延迟直接加压。
immediate_danger_contra_no_untrained_tourniquet: 在不适用或未经相应训练时，不要自行制作止血带或进行填塞。
immediate_danger_contra_no_universal_cpr: 在未按年龄和原因分流、且没有受训调度员指引时，不要套用单一的心肺复苏步骤。
immediate_danger_contra_normal_not_safe: 不要把正常呼吸当作无反应人员已经安全的证明。
immediate_danger_contra_do_not_stop_monitoring: 不要停止观察呼吸或反应是否变化。
immediate_danger_contra_unknown_not_safe: 不要推断未识别的危险是安全的。
immediate_danger_contra_no_investigation: 不要进入新的危险区域进行调查。
immediate_danger_contra_return_if_changed: 如果情况改变，请重新进入立即危险流程。
