psych_crisis_direct_question: 你现在是否正在考虑自杀或伤害自己？是否处于即时危险中，或能够接触到伤害自己的手段？
psych_crisis_question_unclear: 我没有理解你的安全状况。你现在是否处于即时危险中，或能够接触到伤害自己的手段？请回答“是”或“否”。
psych_crisis_no_immediate_danger: 谢谢你回答。你表示目前没有即时危险。这不是临床评估；仍请联系可信任的人或合格专业人员。
psych_crisis_immediate_danger: 你表示目前存在即时危险。请立即行动，并使用所在地可获得的最安全援助。
psych_crisis_action_stay_together: 不要独处。请附近可信任的人陪着你；如果你在帮助他人，请留在对方身边。
psych_crisis_action_reduce_access: 远离武器、药物、高处、车辆或其他可能用于自伤的手段；在确保安全的前提下，请他人代为保管。
psych_crisis_action_seek_support: 立即联系当地紧急服务、危机援助、医务人员或可信任的人。
