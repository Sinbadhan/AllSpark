name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check allspark/ tests/

      - name: Type check with mypy
        run: mypy allspark/ --ignore-missing-imports

      - name: Run tests with pytest
        # SHA-28: full suite is tracked in version control and gates merges
        # across all supported Python versions. Hardware/live-model smoke
        # tests auto-skip (gated behind ALLSPARK_LIVE_* env vars / importorskip).
        # SHA-151: coverage gate. term-missing surfaces per-module coverage so
        # low-coverage domains are visible (not hidden behind the total), and
        # --cov-fail-under prevents total coverage from regressing below the
        # ratcheted floor (raise over time as critical-path tests land).
        run: pytest -q --tb=short --cov=allspark --cov-report=term-missing --cov-fail-under=60

      - name: Test collection count gate
        # SHA-151: ensure the suite isn't silently shrinking (removing tests
        # could otherwise bypass the coverage gate). Floor ratcheted to the
        # current count; raise as tests are added.
        run: |
          COUNT=$(pytest --collect-only -q 2>/dev/null | grep -c "::")
          echo "Collected tests: $COUNT"
          test "$COUNT" -ge 700

      - name: Module import smoke benchmark (advisory)
        # Soft budget: prints ::warning:: and stays green when import time
        # drifts above IMPORT_BUDGET_MS (default 600 ms). Track regressions
        # over time without breaking unrelated PRs. Promote to --hard-fail
        # when v1.2 lands and the floor has been stable.
        run: python scripts/bench_import.py --check
