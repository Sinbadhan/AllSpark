name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check allspark/ tests/

      - name: Type check with mypy
        run: mypy allspark/ --ignore-missing-imports

      - name: Run tests with coverage (Python 3.10)
        if: matrix.python-version == '3.10'
        # SHA-28: full suite is tracked in version control and gates merges
        # across all supported Python versions. Hardware/live-model smoke
        # tests auto-skip (gated behind ALLSPARK_LIVE_* env vars / importorskip).
        # SHA-151: Python 3.10 is the canonical coverage environment. Coverage
        # 7.x does not consistently trace Starlette TestClient portal threads
        # on Python 3.11/3.12, even though those requests and assertions pass.
        # Keep one authoritative coverage result instead of comparing tracer
        # artifacts across runtimes; the next step still enforces total LINE
        # coverage plus per-module BRANCH floors without lowering either gate.
        run: pytest -q --tb=short --cov=allspark --cov-branch --cov-report=term-missing --cov-report=json:coverage.json

      - name: Run full tests (Python 3.11 and 3.12)
        if: matrix.python-version != '3.10'
        run: pytest -q --tb=short

      - name: Per-module branch coverage gate
        if: matrix.python-version == '3.10'
        # SHA-151: enforce ratcheted per-module BRANCH floors on the critical
        # path (auth/init/SKF/import/reset/backup/search/resource) and other
        # high-risk low-coverage modules, and enforce >=75% total line coverage.
        # Runs only when pytest passed (CI stops on the prior step otherwise).
        run: python scripts/check_coverage.py --coverage-json coverage.json

      - name: Test collection count gate
        # SHA-151: ensure the suite isn't silently shrinking (removing tests
        # could otherwise bypass the coverage gate). Floor ratcheted to the
        # current count; raise as tests are added. Parse the "N tests collected"
        # summary line (pytest 9.x --collect-only -q prints a tree view, not
        # path::test IDs, so grep on "::" would undercount).
        run: |
          COUNT=$(pytest --collect-only -q 2>&1 | grep -oE '[0-9]+ tests? collected' | head -1 | grep -oE '[0-9]+' || echo 0)
          echo "Collected tests: $COUNT"
          test "${COUNT:-0}" -ge 1133

      - name: Module import smoke benchmark (advisory)
        # Soft budget: prints ::warning:: and stays green when import time
        # drifts above IMPORT_BUDGET_MS (default 600 ms). Track regressions
        # over time without breaking unrelated PRs. Promote to --hard-fail
        # when v1.2 lands and the floor has been stable.
        run: python scripts/bench_import.py --check

  smoke:
    # SHA-157: validate the wheel installs and runs in a clean environment.
    # The editable install (`pip install -e .`) hides packaging/metadata and
    # dependency-declaration issues; this catches them before release. Matrix
    # across all supported Python versions (3.10 caught a missing tomli dep
    # that 3.12-only smoke missed).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel
      - name: Install in clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install dist/*.whl
      - name: Smoke (import + CLI help)
        run: |
          /tmp/venv/bin/python -c "import allspark; print('allspark', allspark.__version__)"
          /tmp/venv/bin/allspark --help
